const WHEEL={active:false,cx:0,cy:0,R:0,CW:0,CH:0,ang:0,omega:0,prog:0,need:10,acc:0,decayAcc:0,down:false,hot:-1,hotT:0,selT:0,flash:0,selX:null,selY:null,particles:[],remain:78,gone:[],tilts:{},
introT:999,introDur:72,sx:0,sy:0};
const WHEEL_N=78, WHEEL_OMEGA=0.28, WHEEL_PER=Math.PI*2/WHEEL_N, WHEEL_HOLD=0.45, WHEEL_DECAY=0.5;
const WHEEL_BASE=0.16;          // 基础角速度（未触碰牌时）
const WHEEL_MAX=0.62;           // 滑过牌时可加速到的角速度上限
const WHEEL_SLOW=0.07;          // 选中一张牌后的慢速角速度
function wheelReset(){ WHEEL.active=false; WHEEL.down=false; WHEEL.hot=-1; WHEEL.prog=0; WHEEL.acc=0; WHEEL.decayAcc=0; WHEEL.omega=WHEEL_BASE; WHEEL.speedT=0;
  WHEEL.introT=WHEEL.introDur; }
function startWheelPick(){
  const W_=window.innerWidth, H_=window.innerHeight;
  WHEEL.active=true;
  // 圆心移到屏幕正左方，牌弧（上半弧+下半弧）正对屏幕中央
  WHEEL.R=H_*0.38;
  WHEEL.cx=W+WHEEL.R*0.55; WHEEL.cy=H*0.5;   // 半径缩小、圆心相应右移 → 牌弧仍居中
  WHEEL.CW=clamp(Math.min(H_*0.085, W_*0.14), 30, 62); WHEEL.CH=WHEEL.CW*1.44;
  WHEEL.ang=-2.25; WHEEL.omega=WHEEL_OMEGA;
  WHEEL.prog=0; WHEEL.acc=0; WHEEL.hot=-1; WHEEL.hotT=0; WHEEL.down=false;
  WHEEL.particles=[]; WHEEL.remain=WHEEL_N; WHEEL.gone=[]; WHEEL.selT=0; WHEEL.flash=0; WHEEL.selX=null; WHEEL.tilts={}; WHEEL.omega=WHEEL_BASE; WHEEL.speedT=0;
  // 入场动画：中心牌叠先被慢速抛向上方，随后牌轮高速旋转接牌
  WHEEL.sx=centerX(); WHEEL.sy=H*0.42;
  WHEEL.thE=-2.25;      // 牌落入牌轮的入口角度（牌轮右上方的弧顶）
  WHEEL.dAng=0.033088;  // 入场期间每帧转角（2.0 rad/s，明显快于平时 0.16）
  WHEEL.omegaF=WHEEL.dAng*60;
  WHEEL.entT0=28;       // 上抛结束、第一张牌开始落入的帧
  WHEEL.landT=68;       // 高速旋转接牌的帧数（约 1.1 秒转 2.25 弧度，刚好铺满可见弧）
  WHEEL.introT=0; WHEEL.introDur=WHEEL.entT0+WHEEL.landT;
  WHEEL.decel=false;
}
function wheelIndexAt(x,y){
  if(!WHEEL.active) return -1;
  if(WHEEL.introT<WHEEL.introDur) return -1;      // 展开动画进行中，暂不接受选牌
  const dx=x-WHEEL.cx, dy=y-WHEEL.cy;
  if(dx > 0) return -1;                        // 圆心在右侧屏外，只响应左侧半圆弧（正C）
  if(dx*dx+dy*dy > (WHEEL.R+WHEEL.CW*2.2)*(WHEEL.R+WHEEL.CW*2.2)) return -1;
  let best=-1, bd=1e9;
  for(let i=0;i<WHEEL_N;i++){
    if(WHEEL.gone.includes(i)) continue;
    const a=WHEEL.ang+i*WHEEL_PER, px=WHEEL.cx+Math.cos(a)*WHEEL.R, py=WHEEL.cy+Math.sin(a)*WHEEL.R;
    if(Math.abs(px-x)<WHEEL.CW*0.62 && Math.abs(py-y)<WHEEL.CH*0.62){
      const d=Math.abs(px-x)+Math.abs(py-y);
      if(d<bd){ bd=d; best=i; }
    }
  }
  return best;
}
// 触碰倾斜：被点到的牌翘起一点，离开后平滑回正
function updateTilts(dt){
  const m=WHEEL.tilts||(WHEEL.tilts={});
  const k=Math.min(1, dt*9);
  for(const key in m){
    const tgt=(parseInt(key,10)===WHEEL.hot && WHEEL.hot>=0)?1:0;
    m[key]+= (tgt-m[key])*k;
    if(tgt===0 && m[key]<0.02) delete m[key];
  }
  if(WHEEL.hot>=0 && m[WHEEL.hot]===undefined) m[WHEEL.hot]=0;
}
function wheelTick(dt){
  if(!WHEEL.active) return;
  updateTilts(dt);
  if(WHEEL.introT<WHEEL.introDur){
    // 入场：上抛阶段牌轮不动，随后以高速接牌
    WHEEL.introT+=1;
    if(WHEEL.introT>=WHEEL.entT0){
      WHEEL.omega=WHEEL.omegaF;
      WHEEL.ang-=WHEEL.dAng;          // 每帧固定转角，保证每张牌准点落到自己的位置
    }else WHEEL.omega=0;
    if(WHEEL.introT>=WHEEL.introDur) WHEEL.decel=true;
    return;
  }
  if(WHEEL.decel){
    // 所有牌落位后，由高速平滑减速回正常转速
    WHEEL.omega+=(WHEEL_BASE-WHEEL.omega)*0.07;
    if(Math.abs(WHEEL.omega-WHEEL_BASE)<0.004){ WHEEL.omega=WHEEL_BASE; WHEEL.decel=false; }
    WHEEL.ang-=WHEEL.omega*dt;
    return;
  }
  // 角速度随交互变化：碰到牌逐渐加快，选中后放慢
  const touching=(WHEEL.down && WHEEL.hot>=0 && !WHEEL.gone.includes(WHEEL.hot));
  const target=(WHEEL.selT>0.5)? WHEEL_SLOW : (touching? WHEEL_MAX : WHEEL_BASE);
  WHEEL.speedT=Math.min(1,(WHEEL.speedT||0)+dt*(touching?2.6:1.8));
  WHEEL.omega+=(target-WHEEL.omega)*Math.min(1,WHEEL.speedT*dt*4);
  if(WHEEL.selT>0.5) WHEEL.speedT=0;
  WHEEL.ang-=WHEEL.omega*dt;                       // 逆时针快速旋转
  if(WHEEL.down){
    if(WHEEL.hot>=0 && !WHEEL.gone.includes(WHEEL.hot)){  // 按住且落在牌上：蓄力
      if(WHEEL.hot!==WHEEL.lastHot){ WHEEL.lastHot=WHEEL.hot; WHEEL.acc=0; WHEEL.prog=Math.min(WHEEL.need,WHEEL.prog+1); }
      WHEEL.acc+=dt/WHEEL_HOLD;
      if(WHEEL.acc>=1){ WHEEL.acc-=1; WHEEL.prog=Math.min(WHEEL.need,WHEEL.prog+1); }
    }else{                                       // 没碰到牌：进度随时间回落（0.2 秒一格）
      WHEEL.acc+=dt;
      while(WHEEL.acc>=WHEEL_DECAY){ WHEEL.acc-=WHEEL_DECAY; if(WHEEL.prog>0) WHEEL.prog-=1; }
    }
  }else{ WHEEL.acc=0; }
  if(!WHEEL.down && WHEEL.prog>0){ WHEEL.decayAcc=(WHEEL.decayAcc||0)+dt; while(WHEEL.decayAcc>=WHEEL_DECAY){ WHEEL.decayAcc-=WHEEL_DECAY; WHEEL.prog--; } }
  if(WHEEL.down) WHEEL.decayAcc=0;
  WHEEL.hotT=Math.max(0, WHEEL.hotT-dt*4);
  WHEEL.selT=Math.max(0,(WHEEL.selT||0)-dt*1.6);
  WHEEL.flash=Math.max(0,(WHEEL.flash||0)-dt*1.4);
  if(WHEEL.prog>=WHEEL.need) wheelPick();
}
function wheelPick(){
  const i=WHEEL.hot;
  if(i<0 || WHEEL.gone.includes(i)){ WHEEL.prog=0; WHEEL.acc=0; return; }
  const c=Tarot.wheelDeck[i];
  WHEEL.gone.push(i); WHEEL.remain--;
  WHEEL.selX=WHEEL.cx+Math.cos(WHEEL.ang+i*WHEEL_PER)*WHEEL.R; WHEEL.selY=WHEEL.cy+Math.sin(WHEEL.ang+i*WHEEL_PER)*WHEEL.R;
  WHEEL.selT=1; WHEEL.flash=1.15; WHEEL.omega=WHEEL_SLOW; WHEEL.speedT=0;
  if(navigator.vibrate) navigator.vibrate(30);
  WHEEL.prog=0; WHEEL.acc=0; WHEEL.down=false; WHEEL.hot=-1; WHEEL.lastHot=-1;
  particleBurst(Tarot.particles, WHEEL.cx+Math.cos(WHEEL.ang+i*WHEEL_PER)*WHEEL.R,
    WHEEL.cy+Math.sin(WHEEL.ang+i*WHEEL_PER)*WHEEL.R, FXC(), 30, 4.5);
  c.fx=WHEEL.selX; c.fy=WHEEL.selY; c.ft=0;   // 选中后向左飞入的起点
  Tarot.pickedCards.push(c);
  Tarot.syncHud();
  // 三张齐：不立即跳转，交给 drawWheel 做“左侧→中间横向”的合并动画
  if(Tarot.pickedCards.length>=3){ Tarot.mergeT=0; }
}
// 已选牌：左侧竖排叠放位置 / 三张合并后居中横向位置
function FINALE_CW(){ return Math.min(W*0.25, WHEEL.CW*1.45); }   // 最后三张横排时的放大牌宽
function wheelSideSlot(i){
  const cw=WHEEL.CW, ch=WHEEL.CH;
  // 进度条占左侧（约 W*0.045+bw），牌列整体右移，避免与其重叠
  const barRight=Math.max(12,W*0.045)+clamp(W*0.045,12,18)+8;
  const x=Math.max(barRight+cw*0.55, W*0.30);
  const gap=Math.min(ch*0.30,(H*0.5-ch*1.15)/2);
  const top=H*0.24+ch/2;
  return {x:x, y:top+i*gap};
}
function wheelCenterSlot(i,n){
  const cw=FINALE_CW(), ch=cw*1.42;
  const gap=Math.max(8, Math.min(20,(W-24-cw*3)/2));
  const y=H*0.16+ch/2;
  return {x:centerX()-(cw*3+gap*2)/2+cw/2+i*(cw+gap), y:y, cw:cw, ch:ch};
}
function wheelGoldOverlay(x,y,w,h,rot,t){       // 金色覆盖版卡背（翘起的牌）
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.fillStyle=INK; ctx.fillRect(-w/2+3,-h/2+3,w,h);
  ctx.fillStyle=FXC(); rr(-w/2,-h/2,w,h,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(let yy=-h/2;yy<h/2;yy+=6) ctx.fillRect(-w/2+3,yy,w-6,1.4);
  ctx.fillStyle=ctx.createPattern(DOT_TEX,'repeat'); rr(-w/2,-h/2,w,h,3); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=2.4; rr(-w/2,-h/2,w,h,3); ctx.stroke();
  ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.strokeRect(-w/2+5,-h/2+5,w-10,h-10);
  diamond(0,0,Math.max(4,w*0.08));
  ctx.restore();
}
function drawWheel(){
  const a=WHEEL.ang, N=WHEEL_N, per=WHEEL_PER, R=WHEEL.R, cw=WHEEL.CW, ch=WHEEL.CH;
  const cx=WHEEL.cx, cy=WHEEL.cy;
  const intro=clamp(WHEEL.introT/WHEEL.introDur,0,1);
  const ie=easeOut(intro);
  const uiA=clamp((intro-0.5)/0.5,0,1);            // 进度条/文字随展开完成度淡入
  // 左侧竖向进度条（从屏幕左缘滑入）
  const bx=Math.max(12, W*0.045), by=H*0.16, bw=clamp(W*0.045,12,18), bh=H*0.56;
  ctx.save();
  ctx.globalAlpha=uiA;
  ctx.translate(-(1-ie)*(bw+26),0);
  ctx.fillStyle='#eceaf2'; rr(bx,by,bw,bh,4); ctx.fill();
  const h=bh*WHEEL.prog/WHEEL.need;
  if(h>0){ ctx.fillStyle=FXC(); rr(bx,by+bh-h,bw,h,3); ctx.fill(); }
  ctx.strokeStyle=INK; ctx.lineWidth=2; rr(bx,by,bw,bh,4); ctx.stroke();
  for(let k=1;k<WHEEL.need;k++){
    const y=by+bh-bh*k/WHEEL.need;
    ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx+bw,y); ctx.stroke();
  }
  ctx.fillStyle=INK; ctx.font='bold 11px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(WHEEL.prog+' / '+WHEEL.need, bx+bw/2, by-6);
  ctx.textAlign='left'; ctx.textBaseline='top'; ctx.font='9px system-ui,sans-serif';
  ctx.fillStyle='#8a8692';
  ctx.fillText('按住牌面 · 滑过加格', bx-2, by+bh+8);
  ctx.restore();

  // ===== 入场：中心牌叠慢速上抛，随后牌轮高速旋转，牌从盘顶逐张落下 =====
  const t=WHEEL.introT;
  if(t<WHEEL.entT0+12){
    // 1) 中心那一叠旋转着飞向屏幕上方（放慢，给第一张牌留出起步时间）
    const k=Math.pow(clamp(t/(WHEEL.entT0+2),0,1),2.2);
    const fx=WHEEL.sx+(W*0.86-WHEEL.sx)*k;
    const fy=WHEEL.sy+(-ch*1.5-WHEEL.sy)*k;
    const a2=clamp(1-Math.max(0,t-(WHEEL.entT0+2))/10,0,1);
    if(a2>0){
      ctx.save(); ctx.globalAlpha=a2*0.95;
      for(let j=7;j>=0;j--){
        drawBack(fx-j*1.3, fy+j*3.2, k*0.3+j*0.04, cw*0.72, ch*0.72, 1);
      }
      ctx.restore();
    }
  }

  // 牌轮：只画右半圆（cos>0），从后往前画
  const order=[];
  for(let i=0;i<N;i++){
    const ang=a+i*per, c=Math.cos(ang);
    if(c<=0) order.push({i:i,ang:ang,c:c});
  }
  order.sort((p,q)=>q.c-p.c);
  for(const o of order){
    if(WHEEL.gone.includes(o.i)) continue;
    let px=cx+Math.cos(o.ang)*R, py=cy+Math.sin(o.ang)*R;
    const tilt=(WHEEL.tilts&&WHEEL.tilts[o.i])||0;   // 被触碰时的左右倾斜量 0~1
    let sc=1, al=0.9, rot=0;                         // 统一朝向：所有牌一个方向叠着
    if(intro<1){
      const tNow=WHEEL.introT;
      // 每张牌“转到盘顶入口”的时刻：i 越大越晚，正好一张接一张
      const tEnt=WHEEL.entT0+o.i*(per/WHEEL.dAng);
      if(tNow<tEnt){
        // 还没轮到这张牌：先隐藏；到入场尾声再整体轻轻淡入，从弧的上下边缘滑进画面
        const f=clamp((tNow-(WHEEL.introDur-16))/16,0,1);
        if(f<=0) continue;
        al=0.9*f;
      }else{
        // 轮到这张牌：从盘顶上方落下，落定后随高速牌轮一起转到自己的位置
        const e=easeOut(clamp((tNow-tEnt)/7,0,1));
        py-=(1-e)*ch*1.25;
        sc=0.86+0.14*e;
        al=0.9*e;
        rot=(1-e)*0.35;
      }
    }
    if(px< -cw*1.5 || px>W+cw*1.5 || py< -ch*1.5 || py>H+ch*1.5) continue;
    const lift=(o.i===WHEEL.hot && intro>=1)?WHEEL.hotT:0;
    if(lift>0){
      // 被触碰：以牌底为支点左右歪一下（不是前后翻转，也不放大）
      const ta=0.17*Math.max(tilt,0.001);
      ctx.save();
      ctx.translate(px, py+ch*0.42); ctx.rotate(rot*0.5 + ta); ctx.translate(0, -ch*0.42 - ch*0.02*lift);
      const gsc=1+0.14*lift;
      ctx.scale(gsc,gsc);
      ctx.globalAlpha=0.35*lift; ctx.fillStyle=FXC();
      rr(-cw*0.7,-ch*0.7,cw*1.4,ch*1.4,6); ctx.fill();
      ctx.globalAlpha=1;
      wheelGoldOverlay(0,0,cw,ch,0,lift);
      ctx.strokeStyle=FXC(); ctx.lineWidth=2.2;
      rr(-cw/2-3,-ch/2-3,cw+6,ch+6,4); ctx.stroke();
      ctx.restore();
    }else if(sc!==1||al!==0.9||rot>0.002||tilt>0.002){
      ctx.save();
      if(tilt>0.002){ ctx.translate(px, py+ch*0.42); ctx.rotate(rot*0.5 + 0.17*tilt); ctx.translate(0,-ch*0.42); }
      else { ctx.translate(px,py); ctx.rotate(rot); }
      if(sc!==1) ctx.scale(sc,sc);
      ctx.globalAlpha=al; drawBack(0,0,0,cw,ch,1); ctx.restore();
    }else{
      ctx.save(); ctx.globalAlpha=0.9;
      drawBack(px,py,0,cw,ch,1); ctx.restore();
    }
  }
  if(WHEEL.selT>0 && WHEEL.selX!=null){
    const t=1-WHEEL.selT;
    ctx.save();
    ctx.globalAlpha=WHEEL.selT;
    ctx.strokeStyle=FXC(); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(WHEEL.selX,WHEEL.selY, cw*0.6+t*cw*1.6, 0, Math.PI*2); ctx.stroke();
    const nm=Tarot.wheelDeck[WHEEL.gone[WHEEL.gone.length-1]].name;
    ctx.font='bold 14px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=INK; ctx.fillText(nm, WHEEL.selX, WHEEL.selY-ch*0.75-t*14);
    ctx.restore();
  }
  if(WHEEL.flash>0){
    ctx.save();
    // 全屏闪白：随 flash 衰减做多次频闪，选中瞬间更强烈
    const strobe=Math.abs(Math.sin(WHEEL.flash*Math.PI*3));   // 衰减过程中的频闪包络
    ctx.globalAlpha=Math.min(0.85, WHEEL.flash*(0.35+0.5*strobe));
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    // 金色内边框脉冲
    const bw=clamp(Math.min(W,H)*0.05,14,42);
    ctx.globalAlpha=Math.min(1,WHEEL.flash*1.1);
    ctx.strokeStyle=FXC(); ctx.lineWidth=bw*0.5*WHEEL.flash;
    ctx.strokeRect(bw/2,bw/2,W-bw,H-bw);
    ctx.restore();
  }
  // ===== 已选牌：选中后向左飞入竖排叠放；三张齐后合并到中间横向排列 =====
  const pc=Tarot.pickedCards;
  const merging=pc.length>=3;
  if(merging) Tarot.mergeT=Math.min(24,(Tarot.mergeT||0)+1);
  const me=easeOut((Tarot.mergeT||0)/24);
  for(let k=0;k<pc.length;k++){
    const card=pc[k];
    card.ft=Math.min(20,(card.ft==null?20:card.ft)+1);
    const e=easeOut(card.ft/20);
    const s0=wheelSideSlot(k);
    let tx=s0.x, ty=s0.y, s1=null;
    if(merging){ s1=wheelCenterSlot(k,3); tx=s0.x+(s1.x-s0.x)*me; ty=s0.y+(s1.y-s0.y)*me; }
    const x=card.fx+(tx-card.fx)*e;
    const y=card.fy+(ty-card.fy)*e - ch*0.18*Math.sin(e*Math.PI);
    const mcw=(s1&&s1.cw!=null)? cw+(s1.cw-cw)*me : cw;
    const mch=(s1&&s1.ch!=null)? ch+(s1.ch-ch)*me : ch;
    drawBack(x,y,0,mcw,mch,1);
    ctx.fillStyle=INK; ctx.font='bold 9px system-ui,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(String(k+1), x+cw/2+5, y-ch/2+6);
  }
  if(merging && (Tarot.mergeT||0)>=24){
    WHEEL.active=false; WHEEL.omega=WHEEL_BASE; WHEEL.speedT=0;
    Tarot.state=Tarot.S.LAYOUT; Tarot.animT=0; Tarot.readingIdx=-1; Tarot.syncHud();
  }
  // 圆心菱形（圆心在屏外，这里不显示，仅保留旋转枢轴）
  if(cx > -cw && cx < W+cw && cy > -ch && cy < H+ch) diamond(cx,cy,Math.max(5,cw*0.16));
  ctx.save();
  ctx.globalAlpha=clamp((WHEEL.introT/WHEEL.introDur-0.4)/0.6,0,1);
  ctx.fillStyle='#6b6574'; ctx.font='10px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('剩余 '+WHEEL.remain+' 张', W/2, H*0.10+16);
  ctx.fillText('已选 '+Tarot.pickedCards.length+' / 3', W/2, H*0.10);
  ctx.restore();
}

let cur=null, mode=null;
function enterMode(m){
  mode=m; homeEl.style.display='none'; barEl.style.display='flex';
  document.getElementById('mask').style.display='none';
  resize();
  if(m==='tarot'){
    cur=Tarot; Tarot.resize();
    document.getElementById('deckV').textContent=Tarot.deck.length||78;
    document.getElementById('deckMax').textContent='78';
    document.getElementById('btnClose').style.display='block';
    dexEl.style.display='none';
    Tarot.enter();
  }else{
    cur=Pixel; Pixel.resize();
    document.getElementById('deckV').textContent=DECK_SIZE;
    document.getElementById('deckMax').textContent=String(DECK_SIZE);
    dexEl.style.display='block'; Pixel.renderDex();
    Pixel.enter(); Pixel.startDeal();
  }
  syncUI();
}
function exitMode(){
  if(cur===Pixel) Pixel.stopAutoDeal();
  cur=null; mode=null;
  homeEl.style.display='flex'; barEl.style.display='none';
  btnMain.style.display='none'; dexEl.style.display='none';
  document.getElementById('btnClose').style.display='none';
  document.getElementById('mask').style.display='none';
  ask.hide();
}
function syncUI(){
  if(!cur){ btnMain.style.display='none'; return; }
  var bsk=document.getElementById('btnSkin');
  const l=cur.mainLabel();
  if(l){ btnMain.style.display='block'; btnMain.textContent=l; btnMain.disabled=false; }
  else btnMain.style.display='none';
  document.getElementById('tag').style.display = cur===Tarot?'block':'block';
  if(cur===Tarot){
    document.getElementById('deckV').textContent=Math.max(0,78-Tarot.pickedCards.length);
    // 收起按钮仅在三张牌摊开后的展示界面显示
    const st=Tarot.state, S=Tarot.S;
    const isFinal=((st===S.RESULT||st===S.LAYOUT) && Tarot.pickedCards.length>=3);
    document.getElementById('btnClose').style.display=isFinal?'block':'none';
    // 摊牌终态顶栏已有「收起」，皮肤入口先让位，避免挤成一排
    if(bsk) bsk.style.display=isFinal?'none':'block';
  }
  else{
    document.getElementById('deckV').textContent=Math.max(0,DECK_SIZE-Pixel.dealCount);
    if(bsk) bsk.style.display='none';
  }
}
document.querySelectorAll('.mode').forEach(el=>{
  el.onclick=()=>enterMode(el.dataset.m);
});
document.getElementById('btnBack').onclick=exitMode;
document.getElementById('btnSkin').onclick=()=>{ if(cur===Tarot) openSkin(); };
document.getElementById('btnRestart').onclick=()=>{ if(cur) cur.reset(); };
document.getElementById('btnClose').onclick=()=>{ if(cur===Pixel) Pixel.closeReveal(); else if(cur===Tarot) Tarot.backToAsk(); };
btnMain.onclick=()=>{ if(cur) cur.mainAction(); };

const ui={
  showResult(isOver){
    const last=Pixel.roundScores.length-1;
    document.getElementById('resTtl').textContent=isOver?'游戏结束 · 总积分':'小回合结束';
    document.getElementById('resRound').textContent=isOver
      ? ('共 '+MAX_ROUND+' 小回合已完成') : ('第 '+Pixel.round+' / '+MAX_ROUND+' 小回合');
    const gain=Pixel.roundScores[last]!=null?Pixel.roundScores[last]:0;
    document.getElementById('resScore').textContent=gain;
    document.getElementById('resGot').textContent=isOver
      ? ('第 5 小回合得分 · 累计 '+Pixel.total()+' 分') : ('本回合 +'+gain+' 分');
    document.getElementById('roundLog').innerHTML=Pixel.roundScores.map((s,i)=>
      '<div><span>第 '+(i+1)+' 小回合</span><span>'+s+' 分</span></div>').join('')+
      '<div style="border-top:1px solid #bbb;margin-top:3px;padding-top:3px"><span>累计总分</span><span>'+Pixel.total()+' 分</span></div>';
    const st=isOver?[0,0,0,0,0,0]:(Pixel.roundStat[last]||Pixel.stat);
    document.getElementById('resDex').innerHTML=P_RAR.map((r,i)=>
      '<div><span><span style="display:inline-block;width:8px;height:8px;background:'+r.fill+
      ';border:1px solid #141018"></span> '+r.name+'（'+r.score+'分）</span><span>×'+st[i]+'</span></div>').join('');
    document.getElementById('closeResult').textContent=isOver?'重新开始 ✕':'关 闭 ✕';
    document.getElementById('mask').style.display='flex';
  }
};
function closeResult(){
  document.getElementById('mask').style.display='none';
  if(Pixel.gameOver){ Pixel.start(); return; }
  Pixel.beginNextRound();
}
document.getElementById('closeResult').onclick=closeResult;
document.getElementById('resultX').onclick=closeResult;

/* ---- 交互 ---- */
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};}
let lastY=0;
function onDown(e){ if(!cur || ask.el.style.display==='flex') return;
  const p=pos(e); lastY=p.y;
  if(cur===Tarot && Tarot.state===Tarot.S.GALLERY){ Tarot.galleryDown(p); return; }
  if(cur===Tarot && Tarot.state===Tarot.S.WHEEL){
    if(WHEEL.introT<WHEEL.introDur) return;          // 展开动画未结束，忽略操作
    WHEEL.hot=wheelIndexAt(p.x,p.y); if(WHEEL.hot>=0)WHEEL.hotT=1; WHEEL.down=true; }
  else cur.tap(p);
  syncUI(); }
function onMove(e){ if(!cur) return;
  const p=pos(e);
  if(cur===Tarot && Tarot.state===Tarot.S.GALLERY){ Tarot.galleryMove(p); lastY=p.y; return; }
  if(cur===Pixel) cur.move(p.x,p.y);
  else if(cur===Tarot && Tarot.state===Tarot.S.WHEEL){ WHEEL.hot=wheelIndexAt(p.x,p.y); if(WHEEL.hot>=0){ WHEEL.hotT=1; if(WHEEL.down && WHEEL.hot!==WHEEL.lastHot){ WHEEL.lastHot=WHEEL.hot; WHEEL.acc=0; WHEEL.prog=Math.min(WHEEL.need,WHEEL.prog+1);} } }
  else cur.move(p.y-lastY);
  lastY=p.y; }
function onUp(){ if(cur===Tarot && Tarot.state===Tarot.S.GALLERY){ Tarot.galleryUp(); return; }
  if(cur===Pixel) Pixel.up(); else if(cur===Tarot && Tarot.state===Tarot.S.WHEEL){ WHEEL.down=false; WHEEL.hot=-1; WHEEL.lastHot=-1; WHEEL.acc=0; } }
cv.addEventListener('mousedown',onDown);
cv.addEventListener('mousemove',onMove);
cv.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
document.addEventListener('mouseup',onUp);
cv.addEventListener('touchend',onUp);
cv.addEventListener('touchcancel',onUp);

/* ---- 主循环 ---- */
function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  if(cur){
    cur.frame();
    if(cur===Tarot && Tarot.state===Tarot.S.ASK){
      ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='600 16px system-ui,sans-serif';
      ctx.fillText('塔罗占卜 · 78 张', centerX(), H*0.42);
      ctx.fillStyle='#8a8692';ctx.font='11px system-ui,sans-serif';
      ctx.fillText('先写下你的问题，再洗牌抽牌', centerX(), H*0.42+22);
    }
    if(cur===Pixel && Pixel.tip){
      ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='11px system-ui,sans-serif';
      ctx.fillText(Pixel.tip, centerX(), H*0.24);
    }
    if(cur===Pixel && (Pixel.state===Pixel.S.IDLE || Pixel.state===Pixel.S.OVER)){
      // 提示区留白，按钮在底部
    }
    syncUI();
  }
  requestAnimationFrame(loop);
}
// 首页模式卡上的迷你示意
(function(){
  const t=document.getElementById('miniTarot'), p=document.getElementById('miniPixel');
  if(!t||!p) return;
  P_RAR.slice(0,6).forEach(r=>{
    const s=document.createElement('span');
    s.style.cssText='display:inline-block;width:12px;height:16px;background:'+r.fill+
      ';border:2px solid #141018;box-shadow:2px 2px 0 #141018';
    p.appendChild(s);
  });
  for(let i=0;i<5;i++){
    const s=document.createElement('span');
    s.style.cssText='display:inline-block;width:12px;height:16px;background:#fff'+
      ';border:2px solid #141018;box-shadow:2px 2px 0 #141018;background-image:radial-gradient(#141018 1px,transparent 1px);background-size:3px 3px';
    t.appendChild(s);
  }
})();
resize();
requestAnimationFrame(loop);
})();
</script>
