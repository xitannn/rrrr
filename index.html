<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>卡牌抽卡 · 双模式</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#fff;user-select:none;-webkit-user-select:none;
  font-family:system-ui,-apple-system,sans-serif;}
canvas{display:block;touch-action:none;}
/* 顶部条 */
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:none;
  align-items:center;justify-content:space-between;gap:8px;
  padding:calc(8px + var(--sat)) 10px 6px;pointer-events:none;}
.bar>*{pointer-events:auto;}
.tag{background:#fff;border:3px solid #141018;box-shadow:3px 3px 0 #141018;
  padding:5px 9px;text-align:center;font:11px/1.25 system-ui,sans-serif;color:#141018;}
#btnBack,#btnRestart{background:#141018;color:#fff;border:2px solid #141018;
  padding:7px 10px;font:12px system-ui,sans-serif;}
#btnClose{display:none;background:#141018;color:#fff;border:2px solid #141018;
  padding:7px 9px;font:12px system-ui,sans-serif;}
/* 底部按钮 */
#btnMain{position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:none;
  bottom:calc(14px + var(--sab));padding:11px 24px;font:14px system-ui,sans-serif;
  letter-spacing:2px;color:#fff;background:#141018;border:3px solid #141018;
  box-shadow:4px 4px 0 #141018;}
#btnMain:disabled{background:#c9c9d4;color:#666;border-color:#141018;box-shadow:3px 3px 0 #999;}
/* 侧栏图鉴 */
#dex{position:fixed;left:8px;bottom:calc(12px + var(--sab));z-index:4;display:none;
  background:rgba(255,255,255,.9);border:2px solid #141018;padding:5px 6px;
  font:9px/1.35 system-ui,sans-serif;color:#3a3a52;}
#dex div{margin:1px 0;white-space:nowrap;}
/* 提问弹窗 */
#ask{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:rgba(255,255,255,.96);z-index:10;
  padding:calc(18px + var(--sat)) 18px calc(18px + var(--sab));}
#ask h2{margin:0;color:#141018;font:600 16px/1.4 system-ui,sans-serif;letter-spacing:1px;text-align:center;}
#ask input{width:100%;max-width:330px;background:#fff;border:2px solid #141018;color:#141018;
  border-radius:3px;padding:10px 12px;font:14px system-ui,sans-serif;outline:none;}
#ask .acts{display:flex;gap:10px;}
#ask button{background:#141018;border:2px solid #141018;color:#fff;padding:9px 18px;
  border-radius:3px;font:14px system-ui,sans-serif;}
#ask button.ghost{background:#fff;color:#141018;}
#ask .tpl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px;}
#ask .tpl span{background:#fff;border:1px solid #141018;color:#333;padding:5px 9px;
  border-radius:2px;font:12px system-ui,sans-serif;}
/* 结算弹窗 */
#mask{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,16,24,.45);
  align-items:center;justify-content:center;padding:16px;}
#panel{position:relative;width:100%;max-width:320px;background:#fff;border:4px solid #141018;
  box-shadow:6px 6px 0 #141018;padding:14px 14px 12px;}
#panel .ttl{font:11px system-ui,sans-serif;letter-spacing:3px;color:#6b6574;text-align:center;}
#panel .roundLine{font:10px system-ui,sans-serif;color:#6f6f92;text-align:center;margin-top:2px;}
#panel .big{font:bold 36px system-ui,sans-serif;color:#141018;text-align:center;line-height:1.1;margin:6px 0 2px;}
#panel .got{font:11px system-ui,sans-serif;text-align:center;color:#44445e;margin-bottom:8px;}
#roundLog,#resDex{border-top:2px dashed #b5b0bd;padding-top:6px;margin-bottom:6px;
  font:10px system-ui,sans-serif;color:#3a3a52;}
#roundLog div,#resDex div{display:flex;justify-content:space-between;margin:2px 0;}
#closeResult{display:block;width:100%;margin-top:8px;padding:9px 0;font:bold 13px system-ui,sans-serif;
  letter-spacing:3px;color:#fff;background:#141018;border:3px solid #141018;box-shadow:3px 3px 0 #141018;}
#resultX{position:absolute;top:-14px;right:-12px;width:28px;height:28px;line-height:1;
  font:bold 12px system-ui,sans-serif;color:#fff;background:#141018;border:3px solid #141018;box-shadow:3px 3px 0 #141018;}
/* 模式选择 */
#home{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;background:#fff;
  padding:calc(20px + var(--sat)) 18px calc(20px + var(--sab));}
#home .logo{font:600 20px/1.3 system-ui,sans-serif;letter-spacing:3px;color:#141018;text-align:center;}
#home .logo small{display:block;margin-top:6px;font:11px system-ui,sans-serif;
  letter-spacing:2px;color:#8a8692;}
.modes{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px;}
.mode{position:relative;text-align:left;background:#fff;border:3px solid #141018;
  box-shadow:5px 5px 0 #141018;padding:12px 12px 10px;}
.mode h3{margin:0 0 4px;font:bold 15px system-ui,sans-serif;letter-spacing:2px;color:#141018;}
.mode p{margin:0;font:11px/1.5 system-ui,sans-serif;color:#5d576b;}
.mode .mini{margin-top:8px;display:flex;gap:3px;flex-wrap:wrap;}
.mode .mini{display:flex;gap:4px;margin-top:8px;}
.mode:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #141018;}
#home .foot{font:10px system-ui,sans-serif;color:#a8a3b0;letter-spacing:1px;text-align:center;}
/* AI 解读弹窗 */
#aiMask{position:fixed;inset:0;z-index:40;display:none;background:rgba(20,16,24,.5);
align-items:center;justify-content:center;padding:16px;}
#aiPanel{position:relative;width:100%;max-width:360px;max-height:82vh;background:#fff;
border:4px solid #141018;box-shadow:6px 6px 0 #141018;padding:14px 14px 12px;display:flex;flex-direction:column;}
#aiPanel .ttl{font:600 13px system-ui,sans-serif;letter-spacing:2px;color:#141018;text-align:center;}
#aiPanel .qline{font:10px system-ui,sans-serif;color:#6f6f92;text-align:center;margin-top:3px;min-height:12px;}
#aiBody{margin-top:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;
font:11.5px/1.65 system-ui,sans-serif;color:#2c2836;border-top:2px dashed #b5b0bd;padding-top:8px;}
#aiBody h4{margin:10px 0 3px;font:bold 11.5px system-ui,sans-serif;color:#141018;letter-spacing:1px;}
#aiBody p{margin:4px 0;}
#aiBody .pos{color:#141018;font-weight:bold;}
#aiBody .loading{text-align:center;color:#8a8692;padding:16px 0;}
#aiFoot{margin-top:8px;font:9px system-ui,sans-serif;color:#a8a3b0;text-align:center;}
#aiFoot a{color:#3a8ee6;cursor:pointer;text-decoration:underline;}
#aiFoot button{background:#fff;border:2px solid #141018;color:#141018;padding:6px 12px;
border-radius:3px;font:11px system-ui,sans-serif;margin-top:4px;}
#aiX{position:absolute;top:-14px;right:-12px;width:28px;height:28px;line-height:1;
font:bold 12px system-ui,sans-serif;color:#fff;background:#141018;border:3px solid #141018;box-shadow:3px 3px 0 #141018;cursor:pointer;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar" id="bar">
  <button id="btnBack">‹ 模式</button>
  <div class="tag" id="tag">牌堆 <span id="deckV">78</span>/<span id="deckMax">78</span></div>
  <button id="btnClose">收起 ✕</button>
  <button id="btnRestart">重来</button>
</div>
<button id="btnMain">抽 牌</button>
<div id="dex"></div>

<div id="ask">
  <h2>心中默想，然后写下你的问题</h2>
  <input id="qInput" placeholder="例如：这段关系接下来会如何发展？" maxlength="40">
  <div class="tpl" id="tpl"></div>
  <div class="acts">
    <button id="qOk">开始洗牌</button>
    <button id="qSkip" class="ghost">直接开始</button>
  </div>
</div>

<div id="mask">
  <div id="panel">
    <button id="resultX">✕</button>
    <div class="ttl" id="resTtl">小回合结束</div>
    <div class="roundLine" id="resRound">第 1 / 5 小回合</div>
    <div class="big" id="resScore">0</div>
    <div class="got" id="resGot">本回合 +0 分</div>
    <div id="roundLog"></div>
    <div id="resDex"></div>
    <button id="closeResult">关 闭 ✕</button>
  </div>
</div>

<!-- AI 解读弹窗 -->
<div id="aiMask">
  <div id="aiPanel">
    <button id="aiX">✕</button>
    <div class="ttl" id="aiTtl">✨ AI 解读</div>
    <div class="qline" id="aiQ"></div>
    <div id="aiBody"></div>
    <div class="aifoot" id="aiFoot"></div>
  </div>
</div>

<div id="home">
  <div class="logo">卡 牌 抽 卡<small>选择模式开始</small></div>
  <div class="modes">
    <div class="mode" data-m="tarot">
      <h3>塔罗牌模式</h3>
      <div class="mini" id="miniTarot"></div>
    </div>
    <div class="mode" data-m="pixel">
      <h3>连抽模式</h3>
      <div class="mini" id="miniPixel"></div>
    </div>
  </div>
</div>

<script>
'use strict';
(function(){
/* ================= 公共：画布 / 统一卡面风格 ================= */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
let SAFE_T=0,SAFE_B=0;
const INK='#141018', PAPER='#ffffff';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const easeOut=t=>1-Math.pow(1-t,3);
const centerX=()=>W/2;

// 统一点阵卡背纹理
const DOT_TEX=(function(){const t=document.createElement('canvas');t.width=t.height=12;
  const g=t.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,12,12);
  g.fillStyle=INK;for(let y=0;y<12;y+=3)for(let x=0;x<12;x+=3)g.fillRect(x,y,1.1,1.1);
  return t;})();

function resize(){
  const vv=window.visualViewport;
  W=window.innerWidth;
  H=(vv&&vv.height)?vv.height:window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cs=getComputedStyle(document.documentElement);
  SAFE_T=parseFloat(cs.getPropertyValue('--sat'))||0;
  SAFE_B=parseFloat(cs.getPropertyValue('--sab'))||0;
  if(cur) cur.resize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);

/* 统一卡片外壳：白底 + 3px 黑边 + 3px 硬阴影 + 点阵纹 */
function cardShell(x,y,w,h,rot,dotted,shadow){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  if(shadow!==0){ctx.fillStyle=INK;ctx.fillRect(-w/2+3,-h/2+3,w,h);}
  ctx.fillStyle=PAPER;rr(-w/2,-h/2,w,h,3);ctx.fill();
  if(dotted){ctx.fillStyle=ctx.createPattern(DOT_TEX,'repeat');rr(-w/2,-h/2,w,h,3);ctx.fill();}
  ctx.strokeStyle=INK;ctx.lineWidth=2.4;rr(-w/2,-h/2,w,h,3);ctx.stroke();
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function diamond(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=INK;
  ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.8,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.8,0);
  ctx.closePath();ctx.fill();ctx.restore();
}
// 统一卡背
function drawBack(x,y,rot,w,h,shadow){
  cardShell(x,y,w,h,rot,true,shadow);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.strokeRect(-w/2+5,-h/2+5,w-10,h-10);
  diamond(0,0,Math.max(4,w*0.08));
  ctx.restore();
}
// 统一翻面
function flipScale(t){const p=(t%1+1)%1;const a=Math.abs(p-0.5)*2;
  return {sx:Math.max(0.04,1-Math.pow(a,0.85)),front:(p<0.5?((t-Math.floor(t))<0.5):true)};}

/* 统一样式按钮（Canvas 内） */
function drawBtn(label,x,y,w,h){
  ctx.fillStyle=INK;ctx.fillRect(x+3,y+3,w,h);
  ctx.fillStyle=PAPER;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#fff';ctx.fillRect(x+3,y+3,w-6,h-6);
  ctx.fillStyle=INK;ctx.font='bold 13px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2);
}
/* 黑边方框按钮：粗黑描边 + 硬阴影，用于 AI 解读 */
function drawBoxBtn(label,x,y,w,h,opt){
  opt=opt||{};
  var bg=opt.bg||PAPER, fg=opt.fg||INK, lw=opt.lw||3;
  ctx.fillStyle=INK; ctx.fillRect(x+lw,y+lw,w,h);
  ctx.fillStyle=bg;  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=fg; ctx.lineWidth=lw;
  ctx.strokeRect(x+lw/2,y+lw/2,w-lw,h-lw);
  ctx.fillStyle=fg;
  ctx.font=opt.font||'bold 14px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2);
}
function wrapText(t,maxW){
  const out=[];let cur='';
  for(const ch of t){ if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;} else cur+=ch;}
  if(cur)out.push(cur);return out;
}
function particleBurst(arr,x,y,col,n,spd){
  for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(spd*0.3,spd);
    arr.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.2,life:rnd(28,58),max:58,col:col,r:rnd(1.2,2.8)});}
}

const TDECK=[];
for(let i=0;i<22;i++){const k=MAJOR[i];
  TDECK.push({id:i,name:k,arc:'大',suit:null,rank:i,img:IMG[k],upMean:MEAN[k][0],revMean:MEAN[k][1],el:'灵魂课题 · 人生阶段'});}
for(let s=0;s<4;s++)for(let r=0;r<14;r++){
  const nm=SUITS[s]+RANK[r];
  const mn=MINOR[nm]||[ELEMENTS[s],ELEMENTS[s]];
  TDECK.push({id:22+s*14+r,name:nm,arc:'小',suit:SUITS[s],rank:r+1,
    img:ELEMENTS[s]+'：'+nm+'的牌面景象',upMean:mn[0],revMean:mn[1],el:ELEMENTS[s]});}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// 黑白线稿牌面（与卡背同一套黑白语言）
function drawTarotArt(c,x,y,w,h){
  const r=mulberry32(hashStr(c.name));
  const pad=w*0.14, ax=x+pad, ay=y+pad*1.3, aw=w-pad*2, ah=h-pad*2.6;
  ctx.save();
  ctx.beginPath();ctx.rect(ax,ay,aw,ah);ctx.clip();
  ctx.fillStyle=ctx.createPattern(DOT_TEX,'repeat');ctx.fillRect(ax,ay,aw,ah);
  const cx=ax+aw/2, cy=ay+ah/2;
  ctx.strokeStyle=INK;ctx.lineWidth=1;
  if(c.arc==='大'){
    const rays=6+(c.id%6)*2;
    for(let i=0;i<rays;i++){const a=i*Math.PI*2/rays;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*aw*0.46,cy+Math.sin(a)*ah*0.44);ctx.stroke();}
    const rings=1+(c.id%3);
    for(let k=0;k<rings;k++){ctx.beginPath();ctx.arc(cx,cy,aw*0.28-k*aw*0.07,0,Math.PI*2);ctx.stroke();}
    ctx.beginPath();
    const sides=(c.id%7)+3;
    for(let i=0;i<=sides;i++){const a=-Math.PI/2+i*Math.PI*2/sides;
      const rr2=aw*0.21*(i%2?0.5:1);
      const px=cx+Math.cos(a)*rr2, py=cy+Math.sin(a)*rr2;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();ctx.stroke();
    ctx.fillStyle=INK;ctx.beginPath();
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;
      const px=cx+Math.cos(a)*aw*0.11, py=cy+Math.sin(a)*aw*0.11;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();ctx.fill();
    for(let i=0;i<7;i++){ctx.fillStyle=(i+c.id)%2?INK:PAPER;
      ctx.fillRect(ax+aw*0.14+i*aw*0.103, ay+ah*0.87, aw*0.055, ah*0.05);}
  }else{
    const n=Math.min(c.rank,10);
    ctx.fillStyle=INK;
    if(c.rank>=11){
      const crowns={11:1,12:2,13:3,14:4}[c.rank];
      for(let k=0;k<crowns;k++){
        const yy=cy-ah*0.16+k*ah*0.11;
        ctx.beginPath();
        ctx.moveTo(cx-aw*0.2,yy);ctx.lineTo(cx-aw*0.2,yy-ah*0.08);
        ctx.lineTo(cx-aw*0.1,yy-ah*0.02);ctx.lineTo(cx,yy-ah*0.1);
        ctx.lineTo(cx+aw*0.1,yy-ah*0.02);ctx.lineTo(cx+aw*0.2,yy-ah*0.08);
        ctx.lineTo(cx+aw*0.2,yy);ctx.closePath();ctx.fill();
      }
    }else{
      const cols=n<=4?1:n<=8?2:3, rows=Math.ceil(n/cols);
      for(let i=0;i<n;i++){
        const cc=i%cols, rr2=Math.floor(i/cols);
        const px=ax+aw*(0.2+0.6*(cols===1?0.5:cc/(cols-1)));
        const py=ay+ah*(0.22+0.56*(rows===1?0.5:rr2/(rows-1)));
        if(c.suit==='权杖'){ctx.fillRect(px-aw*0.014,py-ah*0.08,aw*0.028,ah*0.16);
          ctx.fillRect(px-aw*0.03,py-ah*0.075,aw*0.06,ah*0.035);}
        else if(c.suit==='圣杯'){ctx.beginPath();ctx.arc(px,py+ah*0.02,aw*0.07,0,Math.PI);ctx.fill();
          ctx.fillRect(px-aw*0.011,py-ah*0.07,aw*0.022,ah*0.08);}
        else if(c.suit==='宝剑'){ctx.beginPath();
          ctx.moveTo(px,py-ah*0.1);ctx.lineTo(px-aw*0.04,py);ctx.lineTo(px,py+ah*0.1);ctx.lineTo(px+aw*0.04,py);
          ctx.closePath();ctx.fill();
          ctx.fillRect(px-aw*0.08,py,aw*0.16,ah*0.018);}
        else{ctx.beginPath();ctx.arc(px,py,aw*0.07,0,Math.PI*2);ctx.stroke();
          ctx.beginPath();ctx.arc(px,py,aw*0.035,0,Math.PI*2);ctx.fill();}
      }
    }
  }
  ctx.restore();
  ctx.fillStyle=INK;
  ctx.font=Math.max(7,w*0.11)+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(c.name,cx,ay-ah*0.02);
  ctx.textAlign='left';
}
function tarotFace(c,x,y,rot,w,h){
  cardShell(x,y,w,h,rot,true,1);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle=PAPER;ctx.fillRect(-w/2+4,-h/2+4,w-8,h*0.16);
  drawTarotArt(c,-w/2+4,-h/2+4,w-8,h-8);
  ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.strokeRect(-w/2+5,-h/2+5,w-10,h-10);
  ctx.fillStyle=INK;
  ctx.font=Math.max(6,w*0.085)+'px system-ui,sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(c.rev?'逆':'正',-w/2+7,-h/2+7);
  ctx.textAlign='right';
  ctx.fillText(c.arc==='大'?'大阿':'小阿',w/2-7,-h/2+7);
  diamond(0,h/2-h*0.07,Math.max(3,w*0.055));
  ctx.restore();
}

// 把整副牌背朝上铺成扇形牌列，等待用户点击选 3 张
buildSpread(){
  const d=this.deck.slice();
  for(let i=d.length-1;i;i--){const j=ri(0,i);[d[i],d[j]]=[d[j],d[i]];}
  const pickedNames=new Set(this.pickedCards.map(x=>x.name));
  const uniq=d.filter(c=>!pickedNames.has(c.name));
  const pool=uniq.length>=3?uniq:d;

  const cols = W<360?5:6;                 // 每行张数
  const rows = Math.ceil(N/cols);
  const top = H*0.14;
  const bottom = this.btnY()-14;
  const areaH = Math.max(180, bottom-top);

  // 牌宽：受每行总宽限制（cw + (cols-1)*cw*overlap <= W*0.94）
  let cw = Math.min(W*0.94/(1+(cols-1)*overlap), 84);

  const rowH = areaH/rows;

  if(this.pickedCards.length>=3){ this.reading=this.pickedCards[0]; this.readingIdx=0;
    this.state=this.S.RESULT; }
  else { this.state=this.S.DEALT; this.dealtT=0; }
},
toast(t){ this.floats.push({t:t,x:centerX(),y:H*0.42,life:80,max:80}); },
reset(){ this.deck=[];this.piles=[];this.fan=[];this.side=[];this.picked=null;this.reading=null;
  this.pickedCards=[];this.readingIdx=0;
  this.spread=[];this.scatter=[];this.animT=0;
  this.particles=[];this.floats=[];this.fanT=0;this.revealT=0;this.shuffleT=0;this.question='';
  wheelReset();
  this.state=this.S.ASK; ask.show(q=>this.start(q)); },
// 回到刚进入塔罗模式时的界面（问题框）
backToAsk(){ this.deck=[];this.piles=[];this.fan=[];this.side=[];this.picked=null;this.reading=null;
  wheelReset();
  this.pickedCards=[];this.readingIdx=0;
  this.spread=[];this.scatter=[];this.animT=0;
  this.particles=[];this.floats=[];this.fanT=0;this.revealT=0;this.shuffleT=0;
  this.state=this.S.ASK; ask.show(q=>this.start(q)); },
syncHud(){ document.getElementById('deckV').textContent=this.deck.length;
  document.getElementById('tag').style.display='block'; },

drawPiles(){
  const y=this.pileY(), gap=Math.min(W*0.2, this.CW*1.7);
  for(let i=0;i<this.PILES_N;i++){
    const cnt=(this.piles[i]||[]).length;
    const x=centerX()-(this.PILES_N-1)*gap/2+i*gap;
    const show=Math.min(cnt,14);
    for(let k=0;k<show;k++) drawBack(x-k*0.7,y-k*0.75,(k%2?1:-1)*0.012,this.CW,this.CH,1);
    if(!cnt){ctx.save();ctx.strokeStyle='rgba(20,16,24,.25)';ctx.setLineDash([3,3]);
      rr(x-this.CW/2,y-this.CH/2,this.CW,this.CH,3);ctx.stroke();ctx.restore();}
    ctx.fillStyle=INK;ctx.font='10px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(cnt+' 张', x, y+this.CH/2+5);
  }
},
drawFanCards(){
  const n=this.fan.length;
  for(let i=0;i<n;i++){
    const c=this.fan[i], p=this.posInFan(i,n); c.x=p.x;c.y=p.y;
    const e=easeOut(clamp(this.fanT-i*4,0,55)/55);
    const x=c.sx+(p.x-c.sx)*e, y=c.sy+(p.y-c.sy)*e-this.CH*0.4*Math.sin(e*Math.PI);
    if(this.state===this.S.FAN && this.revealT<=0){ drawBack(x,y,0,this.CW,this.CH,1); }
    else{
      const f=flipScale(clamp((this.revealT-i*6)/24,0,c.arc==='大'?3:1));
      ctx.save();ctx.translate(x,y);ctx.scale(f.sx*(c.arc==='大'?1.04:1),c.arc==='大'?1.04:1);
      if(f.front) tarotFace(c,0,0,0,this.CW,this.CH); else drawBack(0,0,0,this.CW,this.CH,0);
      ctx.restore();
    }
  }
},
// —— 新流程：扇形牌列等待点击 ——
drawSpread(){
  const n=this.spread.length;
  for(let i=0;i<n;i++){
    const c=this.spread[i];
    if(c.taken) continue;
    const p=this.spreadPos(i);
    const e=easeOut(clamp((this.animT-i)/16,0,1));
    c.x=p.x; c.y=p.y; c.rot=p.rot;
    ctx.save();
    ctx.globalAlpha=0.35+0.65*e;
    drawBack(p.x,p.y,p.rot,this.CW,this.CH,1);
    ctx.restore();
  }
  ctx.fillStyle=INK;ctx.font='600 13px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('轻点三张牌', centerX(), H*0.09);
  ctx.fillStyle='#8a8692';ctx.font='10px system-ui,sans-serif';
  ctx.fillText('已选 '+this.pickedCards.length+' / 3 · 牌面朝下', centerX(), H*0.09+16);
},
// 被点击的牌从扇形中抽出上浮，仍为背面
drawLift(){
  this.drawSpread();
  const c=this.picked; if(!c) return;
  const e=easeOut(clamp(this.animT/22,0,1));
  if(this.pickedCards.length>=2){ this.enterScatter(); return; }
  this.picked=null; this.state=this.S.SPREAD; this.animT=0;
  const y=c.sy-(this.CH*0.42)*e;
  const sc=1+0.06*e;
  c.x=centerX(); c.y=y;
  ctx.save();ctx.translate(centerX(),y);ctx.scale(sc,sc);
  drawBack(0,0,0,this.CW,this.CH,1);
  ctx.restore();
  ctx.fillStyle='#8a8692';ctx.font='10px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('已抽出 · 第 '+(this.pickedCards.length+1)+' 张', centerX(), y-this.CH*0.75);
},
// 其余牌向上飞出消失
drawScatter(){
  const n=this.scatter.length;
  for(let i=0;i<n;i++){
    const c=this.scatter[i];
    const e=clamp(this.animT/26,0,1);
    const yy=c.y-(this.CH*2.6)*easeOut(e);
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-e);
    ctx.translate(c.x+(c.dx||0)*e, yy);
    ctx.rotate((c.rot||0)*e*2);
    drawBack(0,0,0,this.CW,this.CH,1);
    ctx.restore();
  }
  // 已抽出的三张停在摊牌位，仍为背面
  for(let i=0;i<this.pickedCards.length;i++){
    const c=this.pickedCards[i], p=this.sidePos(i);
    const e=clamp(this.animT/26,0,1);
    c.x=p.x; c.y=p.y;
    const fx=c.sx+(p.x-c.sx)*easeOut(e), fy=c.sy+(p.y-c.sy)*easeOut(e)-this.CH*0.2*Math.sin(easeOut(e)*Math.PI);
    if(e<1) drawBack(fx,fy,0,this.CW,this.CH,1); else drawBack(p.x,p.y,0,this.CW,this.CH,1);
  }
},
// 三张依次排列在屏幕中部（横向）
layoutPos(i){
  const cw=this.CW;
  const gap=Math.max(10, Math.min(22,(W-24-cw*3)/2));
  const y=H*0.44;
  return {x:centerX()-(cw*3+gap*2)/2+cw/2+i*(cw+gap), y:y};
},
// 左侧空白处竖排排列（选中后的牌统一叠放于此）
sidePos(i){
  const cw=this.CW, ch=this.CH;
  const x=Math.max(cw*0.62+10, W*0.17);
  const gap=Math.min(ch*0.34, (H*0.62-ch*1.3)/2);
  const top=H*0.24+ch/2;
  return {x:x, y:top+i*gap};
},
drawLayout(){
  const list=this.pickedCards;
  const cw=FINALE_CW(), ch=cw*1.42;
  const gap=Math.max(8, Math.min(20,(W-24-cw*3)/2));
  const y=H*0.16+ch/2;
  for(let i=0;i<list.length;i++){
    const c=list[i];
    const x=centerX()-(cw*3+gap*2)/2+cw/2+i*(cw+gap);
    c.x=x; c.y=y;
    const on=(i===this.readingIdx);
    if(on){ ctx.fillStyle=INK; ctx.fillRect(x-cw/2-5, y-ch/2-5, cw+10, ch+10); }
    if(c.flipped){
      // 已翻开：直接显示正面，无翻牌动画，也不会翻回背面
      tarotFace(c,x,y,0,cw,ch);
    }else{
      drawBack(x,y,0,cw,ch,1);
    }
    ctx.fillStyle=on?INK:'#6b6574';
    ctx.font=(on?'bold ':'')+'10px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText((i+1)+'.', x, y+ch/2+4);
  }
  if(this.readingIdx>list.length-1) this.readingIdx=list.length-1;
  // 只有点击过某张牌（该牌已翻开）才显示释义；未点击不出现任何牌义
  const c=list[this.readingIdx];
  const top=y+ch/2+18;
  if(list.length>=3 && c && c.flipped && this.animT>6){ this.drawReading(c,{x:22,w:W-44,top:top}); }
  else if(list.length>=3 && this.animT>6){
    // 三张都还是背面：提示玩家点击翻牌看释义
    ctx.fillStyle='#8a8692';ctx.font='10px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('点击下方任意一张牌翻开', centerX(), top);
    ctx.fillText('查看牌义与正逆位', centerX(), top+14);
  }
},
drawReading(c,col){
  if(col){
    // 横向牌列下方排版：牌名 + 牌义居中
    const x=col.x, mw=col.w;

    ctx.fillStyle='#3d3846';ctx.font='10px system-ui,sans-serif';
    ctx.textAlign='left';

    ctx.fillStyle=INK;ctx.font='11px system-ui,sans-serif';

  ctx.fillStyle='#3d3846';ctx.font='11px system-ui,sans-serif';

  // AI 解读按钮（仅当有牌已翻开时显示）

},
drawPicked(){

},
drawSide(){

drawFinal(){

aiBtnRect(){
  const abh=this.btnH();
  if(this.state===this.S.LAYOUT){
    const abw=Math.min(220,W-40);
    return {x:centerX()-abw/2, y:this.btnY()-abh-6, w:abw, h:abh};
  }
  const abw=Math.min(220,W-40);
  return {x:centerX()-abw/2,y:this.btnY()-14-abh-6,w:abw,h:abh};
},
frame(){
  const S=this.S;
  if(this.state===S.SHUFFLE){
    this.shuffleT++;
    const n=48,dur=44;
    const e=easeOut(clamp(this.shuffleT/dur,0,1));
    for(let i=0;i<n;i++){
      const a=i*2.399963, r0=Math.max(W,H)*0.5;
      const sx=centerX()+Math.cos(a)*r0, sy=H*0.42+Math.sin(a)*r0;
      const tx=centerX()+Math.cos(a+i)*W*0.1, ty=H*0.42+Math.sin(a*1.7)*H*0.06;
      const jx=Math.sin(this.shuffleT*0.3+i)*9*(1-clamp(this.shuffleT/dur,0,1));
      drawBack(sx+(tx-sx)*e+jx, sy+(ty-sy)*e+jx, Math.sin(this.shuffleT*0.2+i)*0.4*(1-clamp(this.shuffleT/dur,0,1)), this.CW*0.72, this.CH*0.72,1);
    }
    if(this.shuffleT>=dur){ this.wheelDeck=this.buildDeck(); startWheelPick(); this.state=S.WHEEL; this.animT=0; this.syncHud(); }
  }
  if(this.state===S.WHEEL){ drawWheel(); }
  if(this.state===S.READY||this.state===S.FAN||this.state===S.PICKED||this.state===S.DEALT) this.drawPiles();
  if(this.state===S.READY){
    ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='600 14px system-ui,sans-serif';
    ctx.fillText('牌已洗好 · 分成 3 叠', centerX(), H*0.30);
    ctx.fillStyle='#8a8692';ctx.font='10px system-ui,sans-serif';
    ctx.fillText('点击下方按钮，每叠各取一张', centerX(), H*0.30+18);
  }
  if(this.state===S.WHEEL){ this.animT++; wheelTick(1/60); }
  if(this.state===S.SPREAD){ this.animT++; this.drawSpread(); }
  if(this.state===S.LIFT){ this.animT++; this.drawSpread();
    if(this.animT>=24){ this.enterScatter(); } }
  if(this.state===S.SCATTER){ this.animT++; this.drawScatter();
    if(this.animT>=28){ this.state=S.LAYOUT; this.animT=0; this.readingIdx=-1;
      // 三张牌保持背面，不自动翻开；需玩家点击某张牌才翻开并显示其释义
      this.syncHud(); } }
  if(this.state===S.LAYOUT){ this.animT++; this.drawLayout(); }
  if(this.state===S.FAN){ this.fanT++; if(this.revealT>0)this.revealT++; this.drawFanCards(); }
  if(this.state===S.PICKED){ this.revealT++; this.drawPicked();
    if(this.revealT>80) this.finishReveal(); }
  if(this.state===S.DEALT){ this.dealtT=(this.dealtT||0)+1; this.drawSingle(this.pickedCards[this.pickedCards.length-1],
    '查看本张 · 点击继续选第 '+(this.pickedCards.length+1)+' 张','继续选牌 ›'); }
  if(this.state===S.RESULT){
    if(this.pickedCards.length>=3) this.drawFinal(); else this.drawResult(); }

  if(this.flashT>0){
    this.flashT-=0.04; if(this.flashT<0)this.flashT=0;
    ctx.save();ctx.globalAlpha=Math.max(0,this.flashT)*0.5;
    ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);ctx.restore();
  }
  for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.99;p.life--;
    if(p.life<=0){this.particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.col;
    ctx.fillRect(p.x,p.y,p.r*1.5,p.r*1.5);ctx.globalAlpha=1;}
  for(let i=this.floats.length-1;i>=0;i--){const f=this.floats[i];
    f.y-=0.6;f.life--;ctx.globalAlpha=f.life/f.max;
    ctx.fillStyle=INK;ctx.font='12px system-ui,sans-serif';
    ctx.textAlign='center';ctx.fillText(f.t,f.x,f.y);ctx.globalAlpha=1;
    if(f.life<=0)this.floats.splice(i,1);}
},
mainLabel(){
  if(this.state===this.S.RESULT && this.pickedCards.length>=3) return '关 闭 ✕';
  return null;
},
mainAction(){
  if(this.state===this.S.RESULT && this.pickedCards.length>=3){ this.backToAsk(); }
},
tap(p){
  const S=this.S;
  if(this.state===S.READY){ this.buildSpread(); return; }
  if(this.state===S.SPREAD){ this.pickFromSpread(p); return; }
  if(this.state===S.LAYOUT){
    // 先判断是否点到 AI 解读按钮
    const c=this.pickedCards[this.readingIdx];
    if(c && c.flipped){ const r=this.aiBtnRect();
      if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h){ openAI(); return; } }
    this.flipCurrent(p); return;
  }
  if(this.state===S.FAN){
    const n=this.fan.length;
    for(let i=0;i<n;i++){const c=this.fan[i],q=this.posInFan(i,n);
      if(Math.abs(p.x-q.x)<this.CW*0.62 && Math.abs(p.y-q.y)<this.CH*0.7){
        this.picked=c;this.picked.x=q.x;this.picked.y=q.y;
        this.state=S.PICKED;this.revealT=0;
        particleBurst(this.particles,q.x,q.y,INK,24,4);
        return;}}
  }
  if(this.state===S.PICKED && this.revealT>30){ this.finishReveal(); return; }
  if(this.state===S.DEALT){
    const bw=Math.min(240,W-32),bh=this.btnH(), bx=centerX()-bw/2, by=this.btnY();
    if(p.x>bx&&p.x<bx+bw&&p.y>by&&p.y<by+bh){ this.mainAction(); }
    return;
  }
  if(this.state===S.RESULT){
    if(this.pickedCards.length>=3){
      const cw=Math.min(this.CW*0.78,(W-56)/3), ch=cw*this.CH/this.CW;
      const gap=Math.min(14,(W-40-cw*3)/2), y=H*0.17;
      for(let i=0;i<3;i++){
        const x=centerX()-(cw*3+gap*2)/2+cw/2+i*(cw+gap);
        if(Math.abs(p.x-x)<cw*0.6 && Math.abs(p.y-y)<ch*0.6){ this.readingIdx=i; return; }
      }
      const r=this.aiBtnRect();
      if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h){ openAI(); return; }
      return;
    }
    const bw=Math.min(240,W-32),bh=this.btnH(), bx=centerX()-bw/2, by=this.btnY();
    if(p.x>bx&&p.x<bx+bw&&p.y>by&&p.y<by+bh){ this.mainAction(); return; }
  }
},
move(dy){ /* 塔罗结果页固定，禁止拖动 */ }
};

/* ================= 模式二：像素连抽（五回合） ================= */
const P_RAR=[
{name:'白',score:1,mark:'□',fill:'#fff',ink:'#141018'},
{name:'绿',score:2,mark:'■',fill:'#4ac86a',ink:'#0d3316'},
{name:'蓝',score:3,mark:'◆',fill:'#3a8ee6',ink:'#0b2545'},
{name:'紫',score:4,mark:'▲',fill:'#9a55d6',ink:'#2d1247'},
{name:'橙',score:5,mark:'★',fill:'#f2913a',ink:'#4a2706'},
{name:'红',score:6,mark:'✦',fill:'#e24141',ink:'#450c0c'}
];
const DECK_SIZE=100, MAX_ROUND=5, FAN_SIZE=5, PILE_N=5, PILE_SIZE=DECK_SIZE/PILE_N;
const DEAL_MS=3000, DEAL_MOVE_MIN=14;

const Pixel={
CW:0,CH:0,
S:{IDLE:0,DEAL:1,SHUFFLE:2,FAN:3,REVEAL:4,OVER:5},
state:0,round:1,roundScores:[], scoreLog:[],roundStat:[],remain:DECK_SIZE,roundBase:0,
roundFinished:false,gameOver:false,
deck:[],fan:[],piles:[],picked:null,sideCards:[],stat:[0,0,0,0,0,0],
floats:[],particles:[],dealCount:0,dealBag:[],fxEmit:null,
shuffleT:0,fanT:0,revealT:0,goldT:0,goldFxT:0,revealed:false,tip:'按住屏幕发牌',
dealTimer:null,pointerDown:false,dealX:0,dealY:0,dealSlot:0,lastMX:0,lastMY:0,
resize(){ this.CW=Math.min(70,W/6.2); this.CH=this.CW*1.42; },
enter(){ /* 保留进度 */ },
start(){
  this.round=1;this.roundScores=[];this.roundStat=[];this.roundBase=0;this.scoreLog=[];
  this.gameOver=false;this.stat=[0,0,0,0,0,0];
  this.beginNextRound();
},
reset(){ this.stopAutoDeal(); this.start(); },
floorY(){ return H-10-this.CH/2; },
pilePos(i){
  const gap=Math.min(this.CW*1.5, W/(PILE_N+1.2));
  return {x:centerX()+(i-(PILE_N-1)/2)*gap, y:H*0.13+(i%2)*3, rot:(i-(PILE_N-1)/2)*0.05};
},
buildDeckOrdered(){
  const compose=[34,25,20,15,5,1], arr=[];
  for(let r=0;r<compose.length;r++) for(let k=0;k<compose[r];k++) arr.push(r);
  for(let i=arr.length-1;i;i--){const j=ri(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
},
buildPiles(){
  this.piles=[];const pool=this.buildDeckOrdered();let idx=0;
  for(let p=0;p<PILE_N;p++){
    const pos=this.pilePos(p), arr=[];
    for(let k=0;k<PILE_SIZE;k++) arr.push({rar:pool[idx++]!=null?pool[idx-1]:0, x:pos.x,y:pos.y,rot:pos.rot});
    this.piles.push(arr);
  }
  this.remain=DECK_SIZE;
},
pileRemain(){ return this.piles.reduce((a,p)=>a+p.length,0); },
pickRarity(){ let r=Math.random(),acc=0;
  for(let i=0;i<6;i++){acc+=[0.34,0.25,0.20,0.15,0.05,0.01][i]; if(r<acc) return i;}
  return 0; },
dealCardAt(px,py){
  if(this.dealCount>=DECK_SIZE) return;
  this.dealCount++;
  const rar=this.dealBag.length?this.dealBag[this.dealBag.length-1-this.dealCount]:this.pickRarity();
  this.deck.push({rar:rar,
    x:Math.max(this.CW/2,Math.min(W-this.CW/2,px)),
    y:Math.max(-this.CH,Math.min(H*0.6,py)),
    rot:(Math.random()-.5)*0.6,
    vx:(Math.random()-.5)*3, vy:1+Math.random()*2, vr:(Math.random()-.5)*0.14,
    landed:false,bounces:0,sx:null});
  document.getElementById('deckV').textContent=DECK_SIZE-this.dealCount;
  if(this.dealCount>=DECK_SIZE) this.stopAutoDeal();
},
nextDealSlot(){
  const n=Math.max(1,Math.round(DEAL_MS/Math.max(16,Math.round(DEAL_MS/DECK_SIZE))));
  this.dealSlot=(this.dealSlot%n)+1;
  return this.dealSlot/(n+1);
},
beginAutoDeal(x,y){
  if(this.state!==this.S.DEAL || this.dealCount>=DECK_SIZE) return;
  this.pointerDown=true; this.dealX=this.lastMX=x; this.dealY=this.lastMY=y;
  this.dealCardAt(this.dealX,this.dealY);
  if(this.dealCount>=DECK_SIZE){ this.stopAutoDeal(); return; }
  if(this.dealTimer) return;
  this.dealSlot=0;
  const interval=Math.max(16,Math.round(DEAL_MS/DECK_SIZE));
  this.dealTimer=setInterval(()=>{
    if(cur!==this || this.state!==this.S.DEAL || this.dealCount>=DECK_SIZE || !this.pointerDown){ this.stopAutoDeal(); return; }
    const t=this.nextDealSlot();
    this.dealCardAt(this.dealX+(Math.random()-.5)*this.CW*.8, Math.min(this.dealY,H*.55)-t*H*.1);
  },interval);
  this.tip='按住连发 · 滑动屏幕也能发牌（3 秒内发完 '+DECK_SIZE+' 张）';
},
moveDeal(x,y){
  if(!this.pointerDown || this.state!==this.S.DEAL || this.dealCount>=DECK_SIZE) return;
  const dx=x-this.lastMX, dy=y-this.lastMY;
  if(dx*dx+dy*dy>=DEAL_MOVE_MIN*DEAL_MOVE_MIN){
    this.dealX=this.lastMX=x; this.dealY=this.lastMY=y;
    this.dealCardAt(x,y);
  }
},
stopAutoDeal(){
  if(this.dealTimer){ clearInterval(this.dealTimer); this.dealTimer=null; }
  this.pointerDown=false;
},
startDeal(){
  this.stopAutoDeal();
  this.deck=[];this.fan=[];this.picked=null;this.revealed=false;this.sideCards=[];
  this.dealCount=0;this.dealBag=this.buildDeckOrdered();
  this.state=this.S.DEAL;
  document.getElementById('deckV').textContent=DECK_SIZE;
  this.tip=this.round>=2 ? ('第 '+this.round+' / '+MAX_ROUND+' 小回合') : '按住屏幕发牌';
  this.renderDex();
},
armShuffleButton(){
  this.state=this.S.IDLE;
  this.tip='第 '+this.round+' / '+MAX_ROUND+' 小回合 · 100 张已发完 · 点击「洗牌」开始抽卡';
},
startShuffle(){
  this.remain=DECK_SIZE;
  this.deck=[];
  for(let i=0;i<DECK_SIZE;i++){
    const c={rar:this.pickRarity(),
      x:centerX()+(Math.random()-.5)*W*.8, y:H*.42+(Math.random()-.5)*H*.6,
      rot:(Math.random()-.5)*.5, vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7,
      landed:false,bounces:0,sx:null};
    this.deck.push(c);
  }
  this.fan=[];this.picked=null;this.revealed=false;this.sideCards=[];this.piles=[];
  this.particles.length=0;this.floats.length=0;this.fxEmit=null;
  this.state=this.S.SHUFFLE;this.shuffleT=0;
  this.tip='第 '+this.round+' / '+MAX_ROUND+' 小回合 · 洗牌中…';
},
startFan(){
  if(!this.piles.length || !this.piles.some(p=>p.length)) this.buildPiles();
  const rars=[];
  for(let p=0;p<PILE_N;p++){
    if(!this.piles[p]) this.piles[p]=[];
    if(!this.piles[p].length && this.deck.length) this.piles[p]=this.deck.splice(0,PILE_SIZE);
    if(this.piles[p].length) rars.push(this.piles[p].pop().rar);
  }
  this.remain=this.pileRemain();
  this.deck=[];
  this.fan=rars.map((r,k)=>{const sp=this.pilePos(k);
    return {rar:r,x:sp.x,y:sp.y,rot:sp.rot,hx:centerX(),hy:H*0.60,hr:0,taken:false};});
  this.state=this.S.FAN;this.fanT=0;
  this.tip='第 '+this.round+' / '+MAX_ROUND+' 小回合 · 从 5 叠各取 1 张 · 选 1 张 · 牌堆剩 '+this.remain;
  this.placeFan();
},
placeFan(){
  const n=this.fan.length; if(!n) return;
  const spread=Math.min(1.9,Math.PI*0.78), step=n>1?spread/(n-1):0;
  const fanR=Math.min(this.CW*4.2,W*0.62)/2, fanY=H*0.60;
  for(let i=0;i<n;i++){
    const a=-spread/2+step*i;
    this.fan[i].hx=centerX()+Math.sin(a)*fanR;
    this.fan[i].hy=fanY-Math.cos(a)*fanR*0.42+fanR*0.42;
    this.fan[i].hr=a*0.85;
  }
},
drawCard(card){
  if(this.state!==this.S.FAN || card.taken) return;
  card.taken=true;
  const others=this.fan.filter(c=>!c.taken);
  others.forEach(c=>{c.taken=true;});
  this.sideCards=others.map((c,k)=>({rar:c.rar,x:c.x,y:c.y,rot:c.rot,
    hx:centerX()+(k-(others.length-1)/2)*this.CW*1.05, hy:H*0.80,
    hr:(k-(others.length-1)/2)*0.08, flip:1}));
  this.picked={rar:card.rar,x:card.x,y:card.y,rot:card.rot,
    tx:centerX(),ty:H*0.46,trot:0,t:0,flipT:0,flashDone:false,spinAcc:null,scale:1.25};
  this.state=this.S.REVEAL;this.revealT=0;this.revealed=false;
  this.tip='';
  syncUI();
},
triggerRareFx(color,n){
  for(let i=0;i<(n||90);i++) this.spawnEdgeParticle(color);
  if(this.fxEmit && this.fxEmit.timer) this.fxEmit.timer=Math.max(this.fxEmit.timer,this.fxEmit.left*0.5);
  else this.fxEmit={color:color,left:n>=300?130:70,timer:0};
  this.goldFxT=180;
},
spawnEdgeParticle(color){
  const top=Math.random()<0.35, fromLeft=Math.random()<0.5;
  const ex=fromLeft?-10:W+10, ey=top?Math.random()*H*0.4:H*0.5+Math.random()*H*0.55;
  const ang=(fromLeft?1:-1)*(0.3+Math.random()*0.7), sp=4+Math.random()*8;
  this.particles.push({x:ex,y:ey,vx:Math.cos(ang)*sp*(fromLeft?1:-1),
    vy:-Math.abs(Math.sin(ang)*sp)-Math.random()*2, g:0.10+Math.random()*0.08,
    col:Math.random()<0.6?color:P_RAR[ri(0,5)].fill, t:0, life:90+Math.random()*70, size:3+Math.random()*4});
},
confirmReveal(){
  if(!this.picked || this.revealed) return;
  this.revealed=true;
  const R=P_RAR[this.picked.rar];
  const total0=this.total();
  this.stat[this.picked.rar]++;
  this.scoreLog.push({round:this.round,rar:this.picked.rar,score:R.score});
  this.floats.push({x:centerX(),y:H*0.46-this.CH*0.8,txt:'+'+R.score,t:0});
  particleBurst(this.particles,centerX(),H*0.46,R.fill,20,4);
  if(R.score>=5 && this.fxEmit && this.fxEmit.left<30) this.fxEmit.left=30;
  this.state=this.S.OVER;
  document.getElementById('btnClose').style.display='block';
  this.renderDex();
  if(this.pileRemain()<=0) this.finishRound();
  else this.tip='点击空白处继续抽下一张';
},
total(){ return this.scoreLog.reduce((a,b)=>a+(b.score||0),0); },
finishRound(){
  if(this.roundFinished) return;
  this.roundFinished=true;
  document.getElementById('btnClose').style.display='none';
  this.roundStat.push(this.stat.slice());
  const acc=this.stat.reduce((a,s,i)=>a+s*P_RAR[i].score,0);
  this.roundScores.push(acc-this.roundBase);
  this.roundBase=acc;
  if(this.round>=MAX_ROUND){ this.gameOver=true; ui.showResult(true); return; }
  this.round++;
  this.beginNextRound();
},
beginNextRound(){
  this.remain=DECK_SIZE;this.roundFinished=false;
  this.deck=[];this.fan=[];this.piles=[];this.sideCards=[];this.picked=null;
  this.revealed=false;this.fxEmit=null;
  document.getElementById('btnClose').style.display='none';
  this.particles.length=0;this.floats.length=0;

},
closeReveal(){

},
mainLabel(){
  if(this.state===this.S.OVER) return null;   // 抽完一张不显示抽卡键，点空白处继续
  if(this.state===this.S.IDLE) return this.pileRemain()>=FAN_SIZE?'抽 卡':'洗 牌';
  return null;
},
mainAction(){
  if(this.state===this.S.OVER){
    if(this.pileRemain()>=FAN_SIZE) this.startFan(); else this.startShuffle();
  }else if(this.state===this.S.IDLE){
    if(this.pileRemain()>=FAN_SIZE) this.startFan(); else this.startShuffle();
  }
},
renderDex(){
  document.getElementById('dex').innerHTML=P_RAR.map((r,i)=>
    '<div><span style="display:inline-block;width:8px;height:8px;background:'+r.fill+
    ';border:1px solid #141018"></span> '+r.mark+' '+r.name+' '+this.stat[i]+'</div>').join('');
},
/* ---- 绘制 ---- */
drawCardFace(x,y,rot,w,h,rar,flip){
  const R=rar!=null?P_RAR[rar]:null;
  const backAmt=flip!=null?clamp(flip,0,1):(R?0:1);
  const front=1-backAmt;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  const HW=w/2,HH=h/2;
  cardShell(0,0,w,h,0,front>0.5?false:true,1);
  if(front>0.5 && R){                      // 正面：黑白点阵底 + 品质色徽记块
    ctx.save();ctx.globalAlpha=front;
    ctx.fillStyle=ctx.createPattern(DOT_TEX,'repeat');
    rr(-HW+4,-HH+4,w-8,h-8,2);ctx.fill();
    const col=R.fill, ink=R.ink;
    ctx.fillStyle=col;ctx.fillRect(-11,-HH+16,22,22);
    ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.strokeRect(-11,-HH+16,22,22);
    ctx.fillStyle=ink;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(R.mark,0,-HH+27);
    ctx.fillStyle=INK;
    ctx.font='bold '+Math.max(8,Math.min(13,w*0.16))+'px system-ui,sans-serif';
    ctx.fillText(R.score+'分 · '+R.name,0,HH-14);
    ctx.restore();
  }else if(front<0.5){                     // 背面：细点阵 + 居中徽记
    ctx.save();ctx.globalAlpha=1-front*2;
    ctx.strokeStyle=INK;ctx.lineWidth=1;
    ctx.strokeRect(-HW+5,-HH+5,w-10,h-10);
    diamond(0,0,Math.max(4,w*0.08));
    ctx.restore();
  }
  ctx.restore();
},
drawDealt(){
  const floor=this.floorY();
  const landed=this.deck.filter(c=>c.landed);
  for(let i=0;i<landed.length;i++){
    const c=landed[i]; c.sx=c.sx==null?c.x:c.sx;
    const row=Math.floor(i/12), col=i%12;
    const tx=centerX()+(col-5.5)*(this.CW*0.72), ty=floor-row*(this.CH*0.18);
    c.sx+=(tx-c.sx)*0.12;
    this.drawCardFace(c.sx,ty,c.rot,this.CW,this.CH,null,1);
  }
  for(let i=0;i<this.deck.length;i++){
    const c=this.deck[i];
    if(!c.landed) this.drawCardFace(c.x,c.y,c.rot,this.CW,this.CH,null,1);
  }
},
frame(){
  const S=this.S;
  if(this.state===S.DEAL){
    const G=0.55,REST=0.45,FRICT=0.80, floor=this.floorY();
    let allLanded=true;
    for(let i=0;i<this.deck.length;i++){
      const c=this.deck[i]; if(c.landed) continue;
      c.vy+=G; c.x+=c.vx; c.y+=c.vy; c.rot+=c.vr;
      if(c.x<this.CW/2){c.x=this.CW/2;c.vx=-c.vx*0.5;}
      else if(c.x>W-this.CW/2){c.x=W-this.CW/2;c.vx=-c.vx*0.5;}
      if(c.y>=floor && c.vy>0){
        c.y=floor;c.vy=-c.vy*REST;c.vx*=FRICT;c.vr*=FRICT;c.bounces++;
        if(c.bounces>=3 && Math.abs(c.vy)<3){c.landed=true;c.vy=0;c.vx=0;}
      }
      if(!c.landed) allLanded=false;
    }
    this.drawDealt();
    if(allLanded && this.dealCount>=DECK_SIZE && this.state===S.DEAL){
      document.getElementById('deckV').textContent=DECK_SIZE;
      this.armShuffleButton();
    }
  }
  if(this.state===S.IDLE) this.drawDealt();

  if(this.state===S.SHUFFLE){
    this.shuffleT++;
    const k=Math.max(0,1-this.shuffleT/46);
    for(let i=0;i<this.deck.length;i++){
      const c=this.deck[i];
      const jx=Math.sin(this.shuffleT*0.21+i*0.7), jy=Math.cos(this.shuffleT*0.17+i*0.9);
      c.vx+=(centerX()-c.x)*0.035+jx*1.2;
      c.vy+=(H*0.42-c.y)*0.035+jy*1.2;
      c.vx*=0.86;c.vy*=0.86;c.x+=c.vx;c.y+=c.vy;
      c.rot+=(Math.random()-.5)*0.2*k;
      const off=(i-this.deck.length/2)*0.5;
      this.drawCardFace(c.x+off,c.y+off*0.4,c.rot,this.CW,this.CH,null,1);
    }
    if(this.shuffleT>48){
      this.buildPiles(); this.deck=[];
      this.state=S.IDLE; this.armShuffleButton();
      this.tip='';
    }
  }
  if(this.piles.length && this.state!==S.DEAL && this.state!==S.SHUFFLE){
    const stepY=Math.max(2.2,Math.min(5,H*0.006));
    for(let p=0;p<this.piles.length;p++){
      const arr=this.piles[p]||[], n=Math.min(arr.length,PILE_SIZE), pos=this.pilePos(p);
      for(let k=0;k<n;k++){
        drawBack(pos.x+(k%2)*0.6, pos.y-k*stepY, pos.rot, this.CW,this.CH, k>6?0:1);
      }
      if(arr.length){
        ctx.fillStyle=INK;ctx.font='bold 10px system-ui,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(arr.length,pos.x+this.CW*0.6,pos.y+this.CH*0.55-n*stepY);
      }
    }
  }
  if(this.state===S.FAN || this.state===S.OVER){
    this.fanT++;
    for(let i=0;i<this.fan.length;i++){
      const c=this.fan[i];
      if(!c.taken && this.state===S.FAN) c.hy+=Math.sin(this.fanT*0.06+i)*0.25;
      c.x+=(c.hx-c.x)*0.25; c.y+=(c.hy-c.y)*0.25; c.rot+=(c.hr-c.rot)*0.25;
      if(c.taken) continue;
      const bob=this.state===S.FAN?Math.sin(this.fanT*0.06+i)*3:0;
      this.drawCardFace(c.x,c.y-bob,c.rot,this.CW,this.CH,null,1);
    }
  }
  for(let i=0;i<this.sideCards.length;i++){
    const sc=this.sideCards[i];
    sc.x+=(sc.hx-sc.x)*0.22; sc.y+=(sc.hy-sc.y)*0.22; sc.rot+=(sc.hr-sc.rot)*0.22;
    if(this.state===S.OVER) sc.flip=Math.max(0,sc.flip-0.08);
    this.drawCardFace(sc.x,sc.y,sc.rot,this.CW*0.8,this.CH*0.8,sc.rar,sc.flip);
  }
  if((this.state===S.REVEAL||this.state===S.OVER) && this.picked){
    const p=this.picked; this.revealT++;
    if(this.state===S.REVEAL){
      p.t=Math.min(1,p.t+0.055);
      p.x+=(p.tx-p.x)*0.18; p.y+=(p.ty-p.y)*0.18;
      const hi=P_RAR[p.rar].score>=5;
      if(!hi || (p.spinAcc!=null && p.spinAcc>=Math.PI*2)) p.rot+=(p.trot-p.rot)*0.18;
      if(p.t>0.45) p.flipT=Math.min(hi?3:1,p.flipT+0.07);
      const ax=flipAx(p.flipT);
      if(hi){ const pulse=1+Math.sin(this.revealT*0.18)*0.05;
        p.scale+=(1.35*pulse-p.scale)*0.2; } else p.scale=1.25;
      let drawRot=p.rot;
      if(hi){ if(p.spinAcc==null)p.spinAcc=0;
        if(p.spinAcc<Math.PI*2){const d=Math.min(Math.PI*2-p.spinAcc,0.06);p.spinAcc+=d;}
        drawRot=p.rot+p.spinAcc; }
      this.drawCardFace(p.x,p.y,drawRot,this.CW*(p.scale||1.25),this.CH*(p.scale||1.25),p.rar,ax);
      if(ax===0 && !p.flashDone){
        p.flashDone=true;
        if(P_RAR[p.rar].score>=5) this.triggerRareFx(P_RAR[p.rar].fill, P_RAR[p.rar].score>=6?300:150);
        particleBurst(this.particles,p.x,p.y,P_RAR[p.rar].fill,14,4);
      }
      if(p.t>=1 && p.flipT>=(hi?3:1)) this.confirmReveal();
    }else{
      const isHi=P_RAR[p.rar].score>=5;
      let drawRot=Math.sin(this.revealT*0.05)*0.03;
      if(isHi){ if(p.spinAcc==null)p.spinAcc=0;
        if(p.spinAcc<Math.PI*2){const d=Math.min(Math.PI*2-p.spinAcc,0.06);p.spinAcc+=d;}
        drawRot=p.rot+p.spinAcc; p.scale=1.35; } else p.scale=1.25;
      const rr2=isHi?(p.scale||1.35):1.25;
      this.drawCardFace(p.x,p.y,drawRot,this.CW*rr2,this.CH*rr2,p.rar,0);
      if(this.goldT>0) goldSweep(p.x,p.y,isHi?drawRot:0,this.CW*rr2,this.CH*rr2,1-this.goldT/30);
      const R=P_RAR[p.rar], by=p.y+this.CH*rr2/2+22;
      ctx.fillStyle=PAPER;ctx.fillRect(centerX()-58,by-11,116,20);
      ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.strokeRect(centerX()-58,by-11,116,20);
      ctx.fillStyle=INK;ctx.font='bold 13px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('+'+R.score+' 分 · '+R.name,centerX(),by);
    }
  }
  if(this.goldT>0) this.goldT--;
  if(this.goldFxT>0){
    const gp=1-this.goldFxT/180, env=Math.sin(Math.min(1,gp*1.05)*Math.PI);
    ctx.save();ctx.globalAlpha=0.16*env;
    const gg=ctx.createRadialGradient(centerX(),H*0.46,10,centerX(),H*0.46,Math.max(W,H)*0.6);
    gg.addColorStop(0,'#ffe9a8');gg.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
    for(let i=0;i<26;i++){
      const a=i/26*Math.PI*2+gp*4, r2=Math.max(W,H)*(0.3+0.35*((i%5)/4));
      ctx.fillStyle='rgba(20,16,24,.35)';
      ctx.fillRect(centerX()+Math.cos(a)*r2-3,H*0.46+Math.sin(a)*r2-3,6,6);
    }
    ctx.restore();
    this.goldFxT--;
  }
  if(this.fxEmit){
    if(this.fxEmit.left>0 && --this.fxEmit.timer<=0){
      this.spawnEdgeParticle(this.fxEmit.color);
      if(Math.random()<0.4) this.spawnEdgeParticle(this.fxEmit.color);
      this.fxEmit.timer=2+ri(0,2); this.fxEmit.left--;
      if(this.goldFxT<30) this.goldFxT=30;
    }
    if(this.fxEmit.left<=0) this.fxEmit=null;
  }
  for(let i=this.floats.length-1;i>=0;i--){
    const f=this.floats[i]; f.t++;
    ctx.globalAlpha=Math.max(0,1-f.t/40);
    ctx.font='bold 20px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=3;ctx.strokeStyle=PAPER;ctx.strokeText(f.txt,f.x,f.y-f.t*1.1);
    ctx.fillStyle=INK;ctx.fillText(f.txt,f.x,f.y-f.t*1.1);
    ctx.globalAlpha=1;
    if(f.t>40) this.floats.splice(i,1);
  }
  for(let i=this.particles.length-1;i>=0;i--){
    const p=this.particles[i]; p.t++;
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.vy*=0.99;p.vy+=(p.g!=null?p.g:0.12);
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    const sz=p.size||4;
    ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,sz,sz);
    ctx.globalAlpha=1;
    if(p.t>p.life) this.particles.splice(i,1);
  }
  this.drawScoreboard();
},
/* 右上角计分板：只累计每张牌的得分 */
drawScoreboard(){
  const S=this.S;
  if(this.scoreLog.length===0) return;
  const bw=88, bh=32;
  const bx=W-bw-10, by=SAFE_T+46;
  ctx.fillStyle=INK; ctx.fillRect(bx+3,by+3,bw,bh);
  ctx.fillStyle='rgba(255,255,255,.94)'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='#5d576b'; ctx.font='9px system-ui,sans-serif';
  ctx.fillText('累计得分', bx+7, by+9);
  ctx.fillStyle=INK; ctx.font='bold 16px system-ui,sans-serif';
  ctx.fillText(String(this.total()), bx+7, by+22);
  // 最近一张牌的得分（若本回合已翻牌）
  if(this.picked && this.revealed && this.picked.rar!=null){
    const R=P_RAR[this.picked.rar];
    ctx.fillStyle=R.fill; ctx.fillRect(bx+bw-24,by+10,14,14);
    ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.strokeRect(bx+bw-24,by+10,14,14);
    ctx.fillStyle=R.ink; ctx.font='bold 8px system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('+'+R.score, bx+bw-17, by+17);
  }
},
tap(p){
  if(document.getElementById('mask').style.display==='flex') return;
  if(this.state===this.S.REVEAL){ this.confirmReveal(); return; }
  if(this.state===this.S.DEAL){ this.beginAutoDeal(p.x,p.y); return; }
  if(this.state===this.S.OVER && this.pileRemain()>0){ this.mainAction(); return; } // 点空白处继续抽
  if(this.state===this.S.FAN){
    for(let i=this.fan.length-1;i>=0;i--){
      const c=this.fan[i]; if(c.taken) continue;
      const dx=p.x-c.x, dy=p.y-c.y;
      const cos=Math.cos(-c.rot), sin=Math.sin(-c.rot);
      const rx2=dx*cos-dy*sin, ry=dx*sin+dy*cos;
      if(Math.abs(rx2)<=this.CW/2 && Math.abs(ry)<=this.CH/2){ this.drawCard(c); return; }
    }
  }
},
move(x,y){ if(this.state===this.S.DEAL) this.moveDeal(x,y); },
up(){ if(this.state===this.S.DEAL) this.stopAutoDeal(); }
};
function flipAx(ft){ const seg=Math.floor(ft), fr=ft-seg; const first=(seg%2===0)?1:0; return fr<0.5?first:1-first; }
function goldSweep(x,y,rot,w,h,prog){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();ctx.rect(-w/2,-h/2,w,h);ctx.clip();
  ctx.globalCompositeOperation='lighter';
  const bandW=w*0.28, gx=-bandW+prog*(w+bandW*2);
  const grad=ctx.createLinearGradient(gx-bandW,0,gx+bandW,0);
  grad.addColorStop(0,'rgba(255,220,120,0)');
  grad.addColorStop(.5,'rgba(255,238,170,'+(0.55*(1-Math.abs(prog-.5)*1.4))+')');
  grad.addColorStop(1,'rgba(255,220,120,0)');
  ctx.fillStyle=grad;ctx.fillRect(-w/2,-h/2,w,h);
  ctx.restore();
}

  // 本地引擎：生成结构化解读 HTML（种子驱动，措辞多样）

                   :this._pick(rng,['正位意味着这股能量正顺畅展开','正位说明它站在这件事的正面','牌面朝上，是可以直接借力的信号']);

  // 综合建议：结合问题、语境、三张具体牌动态生成，措辞多样
  advice(list,q,ctx,rng){

    const open=this._pick(rng,[
      '把目光拉回「'+topic+'」，','再说回「'+topic+'」这件事，','落到你的问题上——「'+topic+'」，',

    let s='<p>'+open+'三张牌里正位 '+pos.length+' 张'+(pos.length?'（'+pos.join('、')+'）':'')+
       '、逆位 '+rev.length+' 张'+(rev.length?'（'+rev.join('、')+'）':'')+'，'+
       this._pick(rng, lean?['整体能量偏顺，但仍要你主动接住。','大势向好，接下来看你如何落子。']
                        :['整体偏收，急着推进反而费力。','现在是收敛期，硬冲不如蓄力。'])+'</p>';
    // 中段：抓住"现在"这张牌给出可执行落点
    const verbs=this._nowVerb()[ctx]||this._nowVerb()['综合'];
    s+='<p>当下这张「'+(now?now.name:'')+'」在说：'+nowMean+'。'+
       '对应到「'+ctx+'」，'+this._pick(rng,verbs)+'，让「'+(now?now.name:'')+'」的能量真正落到实处。'+
       this._pick(rng,['别只停在想，动起来答案才会浮现。','小步试错，好过原地反复权衡。','先做最难的那一步，剩下的会顺很多。'])+'</p>';
    // 尾段：呼应"未来"收束
    s+='<p>望向未来，「'+(fut?fut.name:'')+'」指向'+futMean+'。'+this._close(list,lean)+'</p>';
    // 随机点缀一句"提醒"（约半数出现，进一步打破雷同）
    if(rng()>0.5){
      s+='<p>'+this._pick(rng,[
        '提醒你一句：牌是镜子不是命令，真正拍板的始终是你。',
        '如果哪句牌义戳中了你，那往往就是此刻最该被听见的声音。',
        '过些时日可以再抽一次，看看同一件事的能量有没有变化。',
        '把这份解读当成一次和自己安静对话的机会，就够了。'])+'</p>';
    }
    return s;
  },
  _lean(list){ let s=0; list.forEach(c=>{ if(c.rev) s-=1; else s+=1; }); return s>=0; },
  // 在线大模型（OpenAI 兼容 /chat/completions）
  async online(list,q){
    const cfg=this.cfg(); if(!cfg||!cfg.url||!cfg.key) throw new Error('no-cfg');
    const cards=list.map((c,i)=>(i+1)+'. '+this.posName(i)+'：'+c.name+'（'+(c.rev?'逆位':'正位')+'）'+
      '｜牌面：'+c.img+'｜牌义：'+(c.rev?c.revMean:c.upMean)).join('\n');
    const prompt='你是资深塔罗解读师。用户问题：「'+(q||'未指定')+'」。\n抽到的三张牌（过去/现在/未来）：\n'+cards+
      '\n请结合问题，用中文分「逐张解读」和「综合建议」两部分作答，语气温和、克制、不说教，避免绝对化断言，约300字。';
    const res=await fetch(cfg.url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model||'gpt-4o-mini',temperature:0.8,
        messages:[{role:'user',content:prompt}]})});
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    const txt=(data.choices&&data.choices[0]&&(data.choices[0].message?.content||data.choices[0].text))||'';
    if(!txt) throw new Error('empty');
    return '<p>'+txt.split(/\n{1,}/).filter(Boolean).map(s=>s.replace(/^#+\s*/,'')).join('</p><p>')+'</p>';
  }
};

const GOLD='#d8a32a';
const WHEEL={active:false,cx:0,cy:0,R:0,CW:0,CH:0,ang:0,omega:0,prog:0,need:10,acc:0,decayAcc:0,down:false,hot:-1,hotT:0,selT:0,flash:0,selX:null,selY:null,particles:[],remain:78,gone:[]};
const WHEEL_N=78, WHEEL_OMEGA=0.28, WHEEL_PER=Math.PI*2/WHEEL_N, WHEEL_HOLD=0.45, WHEEL_DECAY=0.5;
const WHEEL_BASE=0.16;          // 基础角速度（未触碰牌时）
const WHEEL_MAX=0.62;           // 滑过牌时可加速到的角速度上限
const WHEEL_SLOW=0.07;          // 选中一张牌后的慢速角速度
function wheelReset(){ WHEEL.active=false; WHEEL.down=false; WHEEL.hot=-1; WHEEL.prog=0; WHEEL.acc=0; WHEEL.decayAcc=0; WHEEL.omega=WHEEL_BASE; WHEEL.speedT=0; }
function startWheelPick(){
  const W_=window.innerWidth, H_=window.innerHeight;
  WHEEL.active=true;
  // 圆心移到屏幕正左方，牌弧（上半弧+下半弧）正对屏幕中央
  WHEEL.R=H_*0.38;
  WHEEL.cx=W+WHEEL.R*0.55; WHEEL.cy=H*0.5;   // 半径缩小、圆心相应右移 → 牌弧仍居中
  WHEEL.CW=clamp(Math.min(H_*0.085, W_*0.14), 30, 62); WHEEL.CH=WHEEL.CW*1.44;
  WHEEL.ang=Math.random()*Math.PI*2; WHEEL.omega=WHEEL_OMEGA;
  WHEEL.prog=0; WHEEL.acc=0; WHEEL.hot=-1; WHEEL.hotT=0; WHEEL.down=false;
  WHEEL.particles=[]; WHEEL.remain=WHEEL_N; WHEEL.gone=[]; WHEEL.selT=0; WHEEL.flash=0; WHEEL.selX=null; WHEEL.omega=WHEEL_BASE; WHEEL.speedT=0;
}
function wheelIndexAt(x,y){
  if(!WHEEL.active) return -1;
  const dx=x-WHEEL.cx, dy=y-WHEEL.cy;
  if(dx > 0) return -1;                        // 圆心在右侧屏外，只响应左侧半圆弧（正C）
  if(dx*dx+dy*dy > (WHEEL.R+WHEEL.CW*2.2)*(WHEEL.R+WHEEL.CW*2.2)) return -1;
  let best=-1, bd=1e9;
  for(let i=0;i<WHEEL_N;i++){
    if(WHEEL.gone.includes(i)) continue;
    const a=WHEEL.ang+i*WHEEL_PER, px=WHEEL.cx+Math.cos(a)*WHEEL.R, py=WHEEL.cy+Math.sin(a)*WHEEL.R;
    if(Math.abs(px-x)<WHEEL.CW*0.62 && Math.abs(py-y)<WHEEL.CH*0.62){
      const d=Math.abs(px-x)+Math.abs(py-y);
      if(d<bd){ bd=d; best=i; }
    }
  }
  return best;
}
function wheelTick(dt){
  if(!WHEEL.active) return;
  // 角速度随交互变化：碰到牌逐渐加快，选中后放慢
  const touching=(WHEEL.down && WHEEL.hot>=0 && !WHEEL.gone.includes(WHEEL.hot));
  const target=(WHEEL.selT>0.5)? WHEEL_SLOW : (touching? WHEEL_MAX : WHEEL_BASE);
  WHEEL.speedT=Math.min(1,(WHEEL.speedT||0)+dt*(touching?2.6:1.8));
  WHEEL.omega+=(target-WHEEL.omega)*Math.min(1,WHEEL.speedT*dt*4);
  if(WHEEL.selT>0.5) WHEEL.speedT=0;
  WHEEL.ang-=WHEEL.omega*dt;                       // 逆时针快速旋转
  if(WHEEL.down){
    if(WHEEL.hot>=0 && !WHEEL.gone.includes(WHEEL.hot)){  // 按住且落在牌上：蓄力
      if(WHEEL.hot!==WHEEL.lastHot){ WHEEL.lastHot=WHEEL.hot; WHEEL.acc=0; WHEEL.prog=Math.min(WHEEL.need,WHEEL.prog+1); }
      WHEEL.acc+=dt/WHEEL_HOLD;
      if(WHEEL.acc>=1){ WHEEL.acc-=1; WHEEL.prog=Math.min(WHEEL.need,WHEEL.prog+1); }
    }else{                                       // 没碰到牌：进度随时间回落（0.2 秒一格）
      WHEEL.acc+=dt;
      while(WHEEL.acc>=WHEEL_DECAY){ WHEEL.acc-=WHEEL_DECAY; if(WHEEL.prog>0) WHEEL.prog-=1; }
    }
  }else{ WHEEL.acc=0; }
  if(!WHEEL.down && WHEEL.prog>0){ WHEEL.decayAcc=(WHEEL.decayAcc||0)+dt; while(WHEEL.decayAcc>=WHEEL_DECAY){ WHEEL.decayAcc-=WHEEL_DECAY; WHEEL.prog--; } }
  if(WHEEL.down) WHEEL.decayAcc=0;
  WHEEL.hotT=Math.max(0, WHEEL.hotT-dt*4);
  WHEEL.selT=Math.max(0,(WHEEL.selT||0)-dt*1.6);
  WHEEL.flash=Math.max(0,(WHEEL.flash||0)-dt*1.4);
  if(WHEEL.prog>=WHEEL.need) wheelPick();
}
function wheelPick(){
  const i=WHEEL.hot;
  if(i<0 || WHEEL.gone.includes(i)){ WHEEL.prog=0; WHEEL.acc=0; return; }
  const c=Tarot.wheelDeck[i];
  WHEEL.gone.push(i); WHEEL.remain--;
  WHEEL.selX=WHEEL.cx+Math.cos(WHEEL.ang+i*WHEEL_PER)*WHEEL.R; WHEEL.selY=WHEEL.cy+Math.sin(WHEEL.ang+i*WHEEL_PER)*WHEEL.R;
  WHEEL.selT=1; WHEEL.flash=1.15; WHEEL.omega=WHEEL_SLOW; WHEEL.speedT=0;
  if(navigator.vibrate) navigator.vibrate(30);
  WHEEL.prog=0; WHEEL.acc=0; WHEEL.down=false; WHEEL.hot=-1; WHEEL.lastHot=-1;
  particleBurst(Tarot.particles, WHEEL.cx+Math.cos(WHEEL.ang+i*WHEEL_PER)*WHEEL.R,
    WHEEL.cy+Math.sin(WHEEL.ang+i*WHEEL_PER)*WHEEL.R, GOLD, 30, 4.5);
  c.fx=WHEEL.selX; c.fy=WHEEL.selY; c.ft=0;   // 选中后向左飞入的起点
  Tarot.pickedCards.push(c);
  Tarot.syncHud();
  // 三张齐：不立即跳转，交给 drawWheel 做“左侧→中间横向”的合并动画
  if(Tarot.pickedCards.length>=3){ Tarot.mergeT=0; }
}
// 已选牌：左侧竖排叠放位置 / 三张合并后居中横向位置
function FINALE_CW(){ return Math.min(W*0.25, WHEEL.CW*1.45); }   // 最后三张横排时的放大牌宽
function wheelSideSlot(i){
  const cw=WHEEL.CW, ch=WHEEL.CH;
  // 进度条占左侧（约 W*0.045+bw），牌列整体右移，避免与其重叠
  const barRight=Math.max(12,W*0.045)+clamp(W*0.045,12,18)+8;
  const x=Math.max(barRight+cw*0.55, W*0.30);
  const gap=Math.min(ch*0.30,(H*0.5-ch*1.15)/2);
  const top=H*0.24+ch/2;
  return {x:x, y:top+i*gap};
}
function wheelCenterSlot(i,n){
  const cw=FINALE_CW(), ch=cw*1.42;
  const gap=Math.max(8, Math.min(20,(W-24-cw*3)/2));
  const y=H*0.16+ch/2;
  return {x:centerX()-(cw*3+gap*2)/2+cw/2+i*(cw+gap), y:y, cw:cw, ch:ch};
}
function wheelGoldOverlay(x,y,w,h,rot,t){       // 金色覆盖版卡背（翘起的牌）
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.fillStyle=INK; ctx.fillRect(-w/2+3,-h/2+3,w,h);
  ctx.fillStyle=GOLD; rr(-w/2,-h/2,w,h,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(let yy=-h/2;yy<h/2;yy+=6) ctx.fillRect(-w/2+3,yy,w-6,1.4);
  ctx.fillStyle=ctx.createPattern(DOT_TEX,'repeat'); rr(-w/2,-h/2,w,h,3); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=2.4; rr(-w/2,-h/2,w,h,3); ctx.stroke();
  ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.strokeRect(-w/2+5,-h/2+5,w-10,h-10);
  diamond(0,0,Math.max(4,w*0.08));
  ctx.restore();
}
function drawWheel(){
  const a=WHEEL.ang, N=WHEEL_N, per=WHEEL_PER, R=WHEEL.R, cw=WHEEL.CW, ch=WHEEL.CH;
  const cx=WHEEL.cx, cy=WHEEL.cy;
  // 左侧竖向进度条
  const bx=Math.max(12, W*0.045), by=H*0.16, bw=clamp(W*0.045,12,18), bh=H*0.56;
  ctx.save();
  ctx.fillStyle='#eceaf2'; rr(bx,by,bw,bh,4); ctx.fill();
  const h=bh*WHEEL.prog/WHEEL.need;
  if(h>0){ ctx.fillStyle=GOLD; rr(bx,by+bh-h,bw,h,3); ctx.fill(); }
  ctx.strokeStyle=INK; ctx.lineWidth=2; rr(bx,by,bw,bh,4); ctx.stroke();
  for(let k=1;k<WHEEL.need;k++){
    const y=by+bh-bh*k/WHEEL.need;
    ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx+bw,y); ctx.stroke();
  }
  ctx.fillStyle=INK; ctx.font='bold 11px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(WHEEL.prog+' / '+WHEEL.need, bx+bw/2, by-6);
  ctx.textAlign='left'; ctx.textBaseline='top'; ctx.font='9px system-ui,sans-serif';
  ctx.fillStyle='#8a8692';
  ctx.fillText('按住牌面 · 滑过加格', bx-2, by+bh+8);
  ctx.restore();
  // 牌轮：只画右半圆（cos>0），从后往前画
  const order=[];
  for(let i=0;i<N;i++){
    const ang=a+i*per, c=Math.cos(ang);
    if(c<=0) order.push({i:i,ang:ang,c:c});
  }
  order.sort((p,q)=>q.c-p.c);
  for(const o of order){
    if(WHEEL.gone.includes(o.i)) continue;
    const px=cx+Math.cos(o.ang)*R, py=cy+Math.sin(o.ang)*R;
    if(px< -cw || px>W+cw || py< -ch || py>H+ch) continue;   // 跳过屏外的牌
    const lift=(o.i===WHEEL.hot)?WHEEL.hotT:0;
    const rot=0;   // 统一朝向：所有牌一个方向叠着，不再随圆周旋转
    if(lift>0){
      ctx.save(); ctx.translate(px,py-ch*0.10*lift); ctx.rotate(rot*0.5);
      const sc=1+0.14*lift;
      ctx.scale(sc,sc);
      ctx.globalAlpha=0.35*lift; ctx.fillStyle=GOLD;
      rr(-cw*0.7,-ch*0.7,cw*1.4,ch*1.4,6); ctx.fill();
      ctx.globalAlpha=1;
      wheelGoldOverlay(0,0,cw,ch,0,lift);
      ctx.strokeStyle=GOLD; ctx.lineWidth=2.2;
      rr(-cw/2-3,-ch/2-3,cw+6,ch+6,4); ctx.stroke();
      ctx.restore();
    }else{
      ctx.save(); ctx.globalAlpha=0.9;
      drawBack(px,py,rot,cw,ch,1); ctx.restore();
    }
  }
  if(WHEEL.selT>0 && WHEEL.selX!=null){
    const t=1-WHEEL.selT;
    ctx.save();
    ctx.globalAlpha=WHEEL.selT;
    ctx.strokeStyle=GOLD; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(WHEEL.selX,WHEEL.selY, cw*0.6+t*cw*1.6, 0, Math.PI*2); ctx.stroke();
    const nm=Tarot.wheelDeck[WHEEL.gone[WHEEL.gone.length-1]].name;
    ctx.font='bold 14px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=INK; ctx.fillText(nm, WHEEL.selX, WHEEL.selY-ch*0.75-t*14);
    ctx.restore();
  }
  if(WHEEL.flash>0){
    ctx.save();
    // 全屏闪白：随 flash 衰减做多次频闪，选中瞬间更强烈
    const strobe=Math.abs(Math.sin(WHEEL.flash*Math.PI*3));   // 衰减过程中的频闪包络
    ctx.globalAlpha=Math.min(0.85, WHEEL.flash*(0.35+0.5*strobe));
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    // 金色内边框脉冲
    const bw=clamp(Math.min(W,H)*0.05,14,42);
    ctx.globalAlpha=Math.min(1,WHEEL.flash*1.1);
    ctx.strokeStyle=GOLD; ctx.lineWidth=bw*0.5*WHEEL.flash;
    ctx.strokeRect(bw/2,bw/2,W-bw,H-bw);
    ctx.restore();
  }
  // ===== 已选牌：选中后向左飞入竖排叠放；三张齐后合并到中间横向排列 =====
  const pc=Tarot.pickedCards;
  const merging=pc.length>=3;
  if(merging) Tarot.mergeT=Math.min(24,(Tarot.mergeT||0)+1);
  const me=easeOut((Tarot.mergeT||0)/24);
  for(let k=0;k<pc.length;k++){
    const card=pc[k];
    card.ft=Math.min(20,(card.ft==null?20:card.ft)+1);
    const e=easeOut(card.ft/20);
    const s0=wheelSideSlot(k);
    let tx=s0.x, ty=s0.y, s1=null;
    if(merging){ s1=wheelCenterSlot(k,3); tx=s0.x+(s1.x-s0.x)*me; ty=s0.y+(s1.y-s0.y)*me; }
    const x=card.fx+(tx-card.fx)*e;
    const y=card.fy+(ty-card.fy)*e - ch*0.18*Math.sin(e*Math.PI);
    const mcw=(s1&&s1.cw!=null)? cw+(s1.cw-cw)*me : cw;
    const mch=(s1&&s1.ch!=null)? ch+(s1.ch-ch)*me : ch;
    drawBack(x,y,0,mcw,mch,1);
    ctx.fillStyle=INK; ctx.font='bold 9px system-ui,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(String(k+1), x+cw/2+5, y-ch/2+6);
  }
  if(merging && (Tarot.mergeT||0)>=24){
    WHEEL.active=false; WHEEL.omega=WHEEL_BASE; WHEEL.speedT=0;
    Tarot.state=Tarot.S.LAYOUT; Tarot.animT=0; Tarot.readingIdx=-1; Tarot.syncHud();
  }
  // 圆心菱形（圆心在屏外，这里不显示，仅保留旋转枢轴）
  if(cx > -cw && cx < W+cw && cy > -ch && cy < H+ch) diamond(cx,cy,Math.max(5,cw*0.16));
  ctx.fillStyle='#6b6574'; ctx.font='10px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('剩余 '+WHEEL.remain+' 张', W/2, H*0.10+16);
  ctx.fillText('已选 '+Tarot.pickedCards.length+' / 3', W/2, H*0.10);
}

let cur=null, mode=null;
function enterMode(m){
  mode=m; homeEl.style.display='none'; barEl.style.display='flex';
  document.getElementById('mask').style.display='none';
  resize();
  if(m==='tarot'){
    cur=Tarot; Tarot.resize();
    document.getElementById('deckV').textContent=Tarot.deck.length||78;
    document.getElementById('deckMax').textContent='78';
    document.getElementById('btnClose').style.display='block';
    dexEl.style.display='none';
    Tarot.enter();
  }else{
    cur=Pixel; Pixel.resize();
    document.getElementById('deckV').textContent=DECK_SIZE;
    document.getElementById('deckMax').textContent=String(DECK_SIZE);
    dexEl.style.display='block'; Pixel.renderDex();
    Pixel.enter(); Pixel.startDeal();
  }
  syncUI();
}
function exitMode(){
  if(cur===Pixel) Pixel.stopAutoDeal();
  cur=null; mode=null;
  homeEl.style.display='flex'; barEl.style.display='none';
  btnMain.style.display='none'; dexEl.style.display='none';
  document.getElementById('btnClose').style.display='none';
  document.getElementById('mask').style.display='none';
  ask.hide();
}
function syncUI(){
  if(!cur){ btnMain.style.display='none'; return; }
  const l=cur.mainLabel();
  if(l){ btnMain.style.display='block'; btnMain.textContent=l; btnMain.disabled=false; }
  else btnMain.style.display='none';
  document.getElementById('tag').style.display = cur===Tarot?'block':'block';
  if(cur===Tarot){
    document.getElementById('deckV').textContent=Math.max(0,78-Tarot.pickedCards.length);
    // 收起按钮仅在三张牌摊开后的展示界面显示
    const st=Tarot.state, S=Tarot.S;
    const isFinal=((st===S.RESULT||st===S.LAYOUT) && Tarot.pickedCards.length>=3);
    document.getElementById('btnClose').style.display=isFinal?'block':'none';
  }
  else document.getElementById('deckV').textContent=Math.max(0,DECK_SIZE-Pixel.dealCount);
}
document.querySelectorAll('.mode').forEach(el=>{
  el.onclick=()=>enterMode(el.dataset.m);
});
document.getElementById('btnBack').onclick=exitMode;
document.getElementById('btnRestart').onclick=()=>{ if(cur) cur.reset(); };
document.getElementById('btnClose').onclick=()=>{ if(cur===Pixel) Pixel.closeReveal(); else if(cur===Tarot) Tarot.backToAsk(); };
btnMain.onclick=()=>{ if(cur) cur.mainAction(); };

const ui={
  showResult(isOver){
    const last=Pixel.roundScores.length-1;
    document.getElementById('resTtl').textContent=isOver?'游戏结束 · 总积分':'小回合结束';
    document.getElementById('resRound').textContent=isOver
      ? ('共 '+MAX_ROUND+' 小回合已完成') : ('第 '+Pixel.round+' / '+MAX_ROUND+' 小回合');
    const gain=Pixel.roundScores[last]!=null?Pixel.roundScores[last]:0;
    document.getElementById('resScore').textContent=gain;
    document.getElementById('resGot').textContent=isOver
      ? ('第 5 小回合得分 · 累计 '+Pixel.total()+' 分') : ('本回合 +'+gain+' 分');
    document.getElementById('roundLog').innerHTML=Pixel.roundScores.map((s,i)=>
      '<div><span>第 '+(i+1)+' 小回合</span><span>'+s+' 分</span></div>').join('')+
      '<div style="border-top:1px solid #bbb;margin-top:3px;padding-top:3px"><span>累计总分</span><span>'+Pixel.total()+' 分</span></div>';
    const st=isOver?[0,0,0,0,0,0]:(Pixel.roundStat[last]||Pixel.stat);
    document.getElementById('resDex').innerHTML=P_RAR.map((r,i)=>
      '<div><span><span style="display:inline-block;width:8px;height:8px;background:'+r.fill+
      ';border:1px solid #141018"></span> '+r.name+'（'+r.score+'分）</span><span>×'+st[i]+'</span></div>').join('');
    document.getElementById('closeResult').textContent=isOver?'重新开始 ✕':'关 闭 ✕';
    document.getElementById('mask').style.display='flex';
  }
};
function closeResult(){
  document.getElementById('mask').style.display='none';
  if(Pixel.gameOver){ Pixel.start(); return; }
  Pixel.beginNextRound();
}
document.getElementById('closeResult').onclick=closeResult;
document.getElementById('resultX').onclick=closeResult;

/* ---- 交互 ---- */
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};}
let lastY=0;
function onDown(e){ if(!cur || ask.el.style.display==='flex') return;
  const p=pos(e); lastY=p.y;
  if(cur===Tarot && Tarot.state===Tarot.S.WHEEL){ WHEEL.hot=wheelIndexAt(p.x,p.y); if(WHEEL.hot>=0)WHEEL.hotT=1; WHEEL.down=true; }
  else cur.tap(p);
  syncUI(); }
function onMove(e){ if(!cur) return;
  const p=pos(e);
  if(cur===Pixel) cur.move(p.x,p.y);
  else if(cur===Tarot && Tarot.state===Tarot.S.WHEEL){ WHEEL.hot=wheelIndexAt(p.x,p.y); if(WHEEL.hot>=0){ WHEEL.hotT=1; if(WHEEL.down && WHEEL.hot!==WHEEL.lastHot){ WHEEL.lastHot=WHEEL.hot; WHEEL.acc=0; WHEEL.prog=Math.min(WHEEL.need,WHEEL.prog+1);} } }
  else cur.move(p.y-lastY);
  lastY=p.y; }
function onUp(){ if(cur===Pixel) Pixel.up(); else if(cur===Tarot && Tarot.state===Tarot.S.WHEEL){ WHEEL.down=false; WHEEL.hot=-1; WHEEL.lastHot=-1; WHEEL.acc=0; } }
cv.addEventListener('mousedown',onDown);
cv.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
document.addEventListener('mouseup',onUp);
cv.addEventListener('touchend',onUp);
cv.addEventListener('touchcancel',onUp);

/* ---- 主循环 ---- */
function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  if(cur){
    cur.frame();
    if(cur===Tarot && Tarot.state===Tarot.S.ASK){
      ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='600 16px system-ui,sans-serif';
      ctx.fillText('塔罗占卜 · 78 张', centerX(), H*0.42);
      ctx.fillStyle='#8a8692';ctx.font='11px system-ui,sans-serif';
      ctx.fillText('先写下你的问题，再洗牌抽牌', centerX(), H*0.42+22);
    }
    if(cur===Pixel && Pixel.tip){
      ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='11px system-ui,sans-serif';
      ctx.fillText(Pixel.tip, centerX(), H*0.24);
    }
    if(cur===Pixel && (Pixel.state===Pixel.S.IDLE || Pixel.state===Pixel.S.OVER)){
      // 提示区留白，按钮在底部
    }
    syncUI();
  }
  requestAnimationFrame(loop);
}
// 首页模式卡上的迷你示意
(function(){
  const t=document.getElementById('miniTarot'), p=document.getElementById('miniPixel');
  if(!t||!p) return;
  P_RAR.slice(0,6).forEach(r=>{
    const s=document.createElement('span');
    s.style.cssText='display:inline-block;width:12px;height:16px;background:'+r.fill+
      ';border:2px solid #141018;box-shadow:2px 2px 0 #141018';
    p.appendChild(s);
  });
  for(let i=0;i<5;i++){
    const s=document.createElement('span');
    s.style.cssText='display:inline-block;width:12px;height:16px;background:#fff'+
      ';border:2px solid #141018;box-shadow:2px 2px 0 #141018;background-image:radial-gradient(#141018 1px,transparent 1px);background-size:3px 3px';
    t.appendChild(s);
  }
})();
resize();
requestAnimationFrame(loop);
})();
</script>
