<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>像素抽卡</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background:#141428;
    font-family:"Courier New",Consolas,monospace;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #wrap { position:relative; width:100vw; height:100vh; max-width:820px; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }

  #scoreBox {
    position:absolute; top:12px; right:12px; z-index:5;
    background:rgba(10,10,22,.82); border:3px solid #000;
    box-shadow:3px 3px 0 #000, inset -2px -2px 0 rgba(0,0,0,.5), inset 2px 2px 0 rgba(255,255,255,.15);
    padding:7px 10px 6px; text-align:right; min-width:104px;
  }
  #scoreBox .lb { font-size:9px; letter-spacing:2px; color:#8a8ab0; }
  #scoreBox .vl { font-size:24px; font-weight:bold; color:#ffe066; text-shadow:2px 2px 0 #000; line-height:1.05; }
  #scoreBox .sub { font-size:9px; color:#6f6f92; margin-top:2px; }

  #tip {
    position:absolute; top:96px; left:0; right:0; z-index:4;
    text-align:center; font-size:11px; letter-spacing:2px; color:#9a9ac4;
    pointer-events:none; padding:0 12px;
  }

  #btn {
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:5;
    padding:12px 26px; font-family:inherit; font-size:15px; font-weight:bold; letter-spacing:3px;
    color:#fff; background:#d24a4a; cursor:pointer;
    border:3px solid #000; box-shadow:4px 4px 0 #000, inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.25);
  }
  #btn:disabled { background:#4a4a5e; color:#888; cursor:not-allowed; }

  #closeBtn {
    position:absolute; z-index:6; display:none;
    padding:8px 10px; font-family:inherit; font-size:11px; font-weight:bold; letter-spacing:1px;
    color:#fff; background:#2b2b3d; cursor:pointer;
    border:3px solid #000; box-shadow:3px 3px 0 #000, inset -2px -2px 0 rgba(0,0,0,.4), inset 2px 2px 0 rgba(255,255,255,.2);
  }
  #closeBtn:hover { background:#3d3d54; }

  #dex {
    position:absolute; left:10px; bottom:16px; z-index:5;
    background:rgba(10,10,22,.72); border:2px solid #000; padding:6px 7px; font-size:9px; color:#9a9ac4;
  }
  #dex div { margin:1px 0; }
  #restart {
    position:fixed; top:12px; left:12px; z-index:40;
    padding:6px 10px; font-family:inherit; font-size:11px; font-weight:bold;
    letter-spacing:1px; color:#ffd7d7; background:#2a0d12; cursor:pointer;
    border:2px solid #000; box-shadow:2px 2px 0 #000, inset -2px -2px 0 rgba(0,0,0,.4), inset 2px 2px 0 rgba(255,255,255,.18);
  }
  #restart:hover { background:#4a1420; }
  #restart:active { transform:translate(2px,2px); box-shadow:none; }
</style>
</head>
<body>
  <button id="restart">重新开始</button>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="scoreBox">
    <div class="lb">SCORE</div>
    <div class="vl" id="score">0</div>
    <div class="sub" id="sub">牌堆 100/100</div>
  </div>
  <div id="tip">点击下方按钮开始洗牌（100 张）</div>
  <button id="closeBtn">收起 ✕</button>
  <button id="btn">抽 卡</button>
  <div id="dex"></div>
</div>

<script>
(function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const btn = document.getElementById('btn');
  const closeBtn = document.getElementById('closeBtn');
  const scoreEl = document.getElementById('score');
  const subEl = document.getElementById('sub');
  const tipEl = document.getElementById('tip');
  const dexEl = document.getElementById('dex');

  // 六档品质：白1 绿2 蓝3 紫4 橙5 红6（概率 34/25/20/15/5/1 %）
  const RAR = [
    { name:'白', score:1, color:'#e6e6e6', ink:'#333' },
    { name:'绿', score:2, color:'#4ac86a', ink:'#0d3316' },
    { name:'蓝', score:3, color:'#3a8ee6', ink:'#0b2545' },
    { name:'紫', score:4, color:'#9a55d6', ink:'#2d1247' },
    { name:'橙', score:5, color:'#f2913a', ink:'#4a2706' },
    { name:'红', score:6, color:'#e24141', ink:'#450c0c' }
  ];

  const DECK_SIZE = 100;  // 一副牌的总张数
  let   remain = DECK_SIZE; // 牌堆剩余张数（越抽越少）
  const FAN_SIZE  = 5;    // 扇形展开张数

  let W = 0, H = 0, CW = 0, CH = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CW = Math.min(70, W / 6.2); CH = CW * 1.42;
    layout();
  }
  window.addEventListener('resize', resize);

  // ---- 状态 ----
  const S = { IDLE:0, SHUFFLE:1, FAN:2, REVEAL:3, OVER:4 };
  let state = S.IDLE;
  let deck = [];            // 当前牌堆 {rar, x, y, rot, vx, vy, vr}
  let fan = [];             // 扇形 6 张 {rar, x, y, rot, taken}
  let picked = null;        // 抽中的牌
  let revealed = false;     // 是否已翻开
  let total = 0, drawn = 0, roundUsed = 0, freshDeck = true;
  let stat = [0,0,0,0,0,0];
  let floats = [], particles = [];

  // 指定概率：红1% 橙5% 紫15% 蓝20% 绿25% 白34%（白最低1分，红最高6分）
  const RAR_P = [0.34, 0.25, 0.20, 0.15, 0.05, 0.01];
  function pickRarity() {
    let r = Math.random(), acc = 0;
    for (let i = 0; i < RAR_P.length; i++) { acc += RAR_P[i]; if (r < acc) return i; }
    return 0;
  }
  function buildDeck(n) {
    const w = [0,0,0,0,0,0];
    const arr = [];
    for (let i = 0; i < n; i++) {
      const r = pickRarity();
      w[r]++; arr.push({ rar: r });
    }
    return { arr, w };
  }

  // ---- 布局 ----
  let centerX = 0, centerY = 0, fanY = 0, fanR = 0, revealY = 0;
  function layout() {
    centerX = W / 2;
    centerY = H * 0.43;
    fanY = H * 0.60;
    fanR = Math.min(CW * 4.2, W * 0.62) / 2;
    revealY = H * 0.30;
    if (state === S.FAN || state === S.OVER) placeFan();
    if (picked) picked.x = centerX;
  }
  function placeFan() {
    const n = fan.length;
    if (!n) return;
    const spread = Math.min(1.9, Math.PI * 0.78);
    const step = n > 1 ? spread / (n - 1) : 0;
    for (let i = 0; i < n; i++) {
      const a = -spread / 2 + step * i;
      fan[i].hx = centerX + Math.sin(a) * fanR;
      fan[i].hy = fanY - Math.cos(a) * fanR * 0.42 + fanR * 0.42;
      fan[i].hr = a * 0.85;
    }
  }

  function startShuffle() {
    freshDeck = (remain === DECK_SIZE);
    const d = buildDeck(remain);
    deck = d.arr;
    if (freshDeck) stat = [0,0,0,0,0,0];
    for (const c of deck) {
      c.x = centerX + (Math.random() - .5) * 30;
      c.y = centerY + (Math.random() - .5) * 30;
      c.rot = (Math.random() - .5) * .5;
      c.vx = (Math.random() - .5) * 7;
      c.vy = (Math.random() - .5) * 7;
      c.vr = (Math.random() - .5) * .2;
    }
    fan = []; picked = null; revealed = false;
    state = S.SHUFFLE; shuffleT = 0;
    closeBtn.style.display = 'none';
    btn.disabled = true;
    tipEl.textContent = '洗牌中… 牌堆剩余 ' + remain + ' 张';
  }

  function startFan() {
    const idx = [];
    const pool = deck.map((c, i) => i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const take = Math.min(FAN_SIZE, pool.length);
    for (let i = 0; i < take; i++) idx.push(pool[i]);
    // 这 5 张离开牌堆 —— 牌越抽越少
    const rars = idx.map(i => deck[i].rar);
    remain -= take;
    deck = [];
    fan = rars.map(r => ({ rar: r, x: centerX, y: centerY, rot: 0, hx: centerX, hy: centerY, hr: 0, taken: false }));
    state = S.FAN; fanT = 0;
    placeFan();
    btn.disabled = true;
    tipEl.textContent = '从 ' + fan.length + ' 张中选 1 张 · 牌堆剩 ' + remain;
  }

  function drawCard(card, i) {
    if (state !== S.FAN || card.taken) return;
    card.taken = true;
    picked = { rar: card.rar, x: card.x, y: card.y, rot: card.rot, tx: centerX, ty: revealY, trot: 0, t: 0, flashDone: false };
    state = S.REVEAL; revealT = 0; revealed = false;
    closeBtn.style.display = 'none';
    tipEl.textContent = '';
  }
  function confirmReveal() {
    if (!picked || revealed) return;
    revealed = true;
    const r = RAR[picked.rar];
    total += r.score; drawn++;
    stat[picked.rar]++;
    scoreEl.textContent = total;
    subEl.textContent = '牌堆 ' + remain + '/' + DECK_SIZE;
    floats.push({ x: centerX, y: revealY - CH / 2 - 8, txt: '+' + r.score, t: 0 });
    for (let i = 0; i < 26; i++) {
      particles.push({
        x: centerX, y: revealY,
        vx: (Math.random() - .5) * 6, vy: (Math.random() - .7) * 6,
        c: r.color, t: 0, life: 30 + Math.random() * 24
      });
    }
    btn.disabled = false;
    state = S.OVER;
    closeBtn.style.display = 'block';
    renderDex();
  }
  function restartGame() {
    remain = DECK_SIZE; total = 0; drawn = 0; stat = [0,0,0,0,0,0];
    deck = []; fan = []; picked = null; revealed = false; closeBtn.style.display = 'none';
    particles.length = 0; floats.length = 0;
    renderDex(); updateScore();
    // 记分清零后，立即把 100 张牌重新发到屏幕中央洗牌
    startShuffle();
  }

  function closeReveal() {
    closeBtn.style.display = 'none';
    picked = null; revealed = false;
    if (remain <= 0) { remain = DECK_SIZE; stat = [0,0,0,0,0,0]; renderDex(); }
    state = S.OVER;
    btn.disabled = false;
    tipEl.textContent = remain > 0 ? '本轮已抽完，重新洗牌继续（剩 ' + remain + ' 张）' : '牌堆已空，重新开始新的一局';
  }

  btn.addEventListener('click', () => {
    if (state === S.OVER || state === S.IDLE) { startShuffle(); }
  });
  closeBtn.addEventListener('click', closeReveal);
  document.getElementById('restart').addEventListener('click', restartGame);

  function hitTest(px, py) {
    if (state !== S.FAN) return null;
    for (let i = fan.length - 1; i >= 0; i--) {
      const c = fan[i];
      if (c.taken) continue;
      const dx = px - c.x, dy = py - c.y;
      const cos = Math.cos(-c.rot), sin = Math.sin(-c.rot);
      const rx = dx * cos - dy * sin, ry = dx * sin + dy * cos;
      if (Math.abs(rx) <= CW / 2 && Math.abs(ry) <= CH / 2) return { card: c, i };
    }
    return null;
  }
  function pos(e) {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function onTap(e) {
    if (state === S.REVEAL) { confirmReveal(); return; }
    if (state === S.FAN) {
      const p = pos(e); const hit = hitTest(p.x, p.y);
      if (hit) drawCard(hit.card, hit.i);
    }
  }
  cv.addEventListener('click', onTap);
  cv.addEventListener('touchstart', e => { e.preventDefault(); onTap(e); }, { passive: false });

  // ---- 绘制 ----
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
  function drawCardFace(x, y, rot, w, h, rar, flip, scale) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    if (scale) ctx.scale(scale, scale);
    const s = flip * w;                 // 卡片水平压缩模拟翻面
    ctx.translate(-w / 2, -h / 2);
    const R = RAR[rar];
    // 阴影
    px(4, 5, w, h, 'rgba(0,0,0,.45)');
    if (s > 0.06 && R) {                // 正面：品质色
      px(0, 0, s, h, '#000');
      px(2, 2, s - 4, h - 4, R.color);
      px(4, 4, s - 8, 10, 'rgba(255,255,255,.35)');
      px(4, h - 14, s - 8, 10, 'rgba(0,0,0,.25)');
      const cx = s / 2;
      px(cx - 4, 22, 8, 8, R.ink);
      px(cx - 12, 34, 24, 4, R.ink);
      px(cx - 8, 42, 16, 4, R.ink);
      px(4, h - 30, s - 8, 12, 'rgba(0,0,0,.18)');
      const fs = Math.max(9, Math.min(13, w * 0.17));
      ctx.fillStyle = R.ink;
      ctx.font = 'bold ' + fs + 'px "Courier New",monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(R.score + '分·' + R.name, cx, h - 24);
    } else {                            // 背面：黑底
      px(0, 0, Math.max(s, 3), h, '#000');
      px(2, 2, Math.max(s - 4, 2), h - 4, '#161622');
      const step = 6;
      for (let yy = 8; yy < h - 6; yy += step) {
        for (let xx = 4; xx + 3 < Math.max(s, 3) - 4; xx += step) {
          px(xx, yy, 3, 3, ((xx / step + yy / step) % 2 === 0) ? '#2b2b40' : '#1c1c2a');
        }
      }
      px(4, 4, Math.max(s - 8, 2), h - 8, 'rgba(255,255,255,.05)');
    }
    // 金光扫光（红/橙稀有登场）：一道斜向光束掠过正面
    if (goldT > 0 && rar && (RAR[rar].score >= 5)) {
      const prog = 1 - goldT / GOLD_MAX;         // 0→1
      ctx.save();
      ctx.translate(x, y); ctx.rotate(rot);
      if (scale) ctx.scale(scale, scale);
      ctx.translate(-w / 2, -h / 2);
      const bandW = w * 0.28;
      const gx = -bandW + prog * (w + bandW * 2);
      ctx.globalCompositeOperation = 'lighter';
      const grad = ctx.createLinearGradient(gx - bandW, 0, gx + bandW, 0);
      grad.addColorStop(0, 'rgba(255,220,120,0)');
      grad.addColorStop(0.5, 'rgba(255,238,170,' + (0.55 * (1 - Math.abs(prog - .5) * 1.4)) + ')');
      grad.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(Math.max(0, gx - bandW), 0, bandW * 2, h);
      // 边缘高光闪一下
      ctx.strokeStyle = 'rgba(255,245,200,' + (0.6 * (1 - prog)) + ')';
      ctx.lineWidth = 3;
      ctx.strokeRect(1, 1, w - 2, h - 2);
      ctx.restore();
    }
    ctx.restore();
  }

  let shuffleT = 0, fanT = 0, revealT = 0, goldT = 0;
  const GOLD_MAX = 30;
  // 全屏金光（红/橙稀有登场）：持续 3 秒，金色粒子从屏幕边缘溢出
  let goldFxT = 0;
  const GOLD_FX_MAX = 180; // 约 3 秒（60fps）
  function triggerGoldFx() {
    goldFxT = GOLD_FX_MAX;
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);

    if (state === S.SHUFFLE) {
      shuffleT++;
      const k = Math.max(0, 1 - shuffleT / 46);
      for (let i = 0; i < deck.length; i++) {
        const c = deck[i];
        const jx = Math.sin(shuffleT * 0.21 + i * 0.7), jy = Math.cos(shuffleT * 0.17 + i * 0.9);
        c.vx += (centerX - c.x) * 0.035 + jx * 1.2;
        c.vy += (centerY - c.y) * 0.035 + jy * 1.2;
        c.vx *= 0.86; c.vy *= 0.86;
        c.x += c.vx; c.y += c.vy;
        c.rot += c.vr * k + (Math.random() - .5) * 0.1 * k;
        const off = (i - deck.length / 2) * 0.5;
        drawCardFace(c.x + off, c.y + off * 0.4, c.rot, CW, CH, null, 0, 1);
      }
      if (shuffleT > 48) startFan();
    }

    if (state === S.FAN || state === S.OVER) {
      fanT++;
      for (let i = 0; i < fan.length; i++) {
        const c = fan[i];
        const e = 1 - Math.pow(0.82, Math.min(fanT, 30));
        if (!c.taken && state === S.FAN) {
          c.hy += Math.sin(fanT * 0.06 + i) * 0.25; // 轻微呼吸
        }
        c.x += (c.hx - c.x) * 0.25;
        c.y += (c.hy - c.y) * 0.25;
        c.rot += (c.hr - c.rot) * 0.25;
        if (c.taken) { drawCardFace(c.x, c.y, c.rot, CW, CH, null, 0, 1); continue; }
        drawCardFace(c.x, c.y - (state === S.FAN ? Math.sin(fanT * 0.06 + i) * 3 : 0), c.rot, CW, CH, c.rar, 0, 1);
      }
    }

    if ((state === S.REVEAL || state === S.OVER) && picked) {
      revealT++;
      const p = picked;
      if (state === S.REVEAL) {
        p.t = Math.min(1, p.t + 0.06);
        const e = 1 - Math.pow(1 - p.t, 3);
        p.x += (p.tx - p.x) * 0.18;
        p.y += (p.ty - p.y) * 0.18;
        p.rot += (p.trot - p.rot) * 0.18;
        // 0→0.5 背面压缩；0.5 瞬间翻到正面；0.5→1 正面展开，清晰看到品质颜色
        const half = p.t >= 0.5;
        const flip = half ? (p.t - 0.5) * 2 : (0.5 - p.t) * 2; // 0→1→0→1→0
        drawCardFace(p.x, p.y, p.rot, CW * 1.25, CH * 1.25, half ? p.rar : null, flip, 1);
        if (half && !p.flashDone) {
          p.flashDone = true;
          if (RAR[p.rar].score >= 5) { goldT = GOLD_MAX; triggerGoldFx(); } // 红/橙金光扫过 + 全屏金光
          for (let k = 0; k < 14; k++) {
            particles.push({
              x: p.x + (Math.random() - .5) * CW, y: p.y + (Math.random() - .5) * CH,
              vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4 - 1,
              t: 0, life: 22 + Math.random() * 14, c: RAR[p.rar].color
            });
          }
        }
        if (p.t >= 1) confirmReveal();
      } else {
        // 展示：完整正面（品质颜色）+ 分数标注
        drawCardFace(p.x, p.y, Math.sin(revealT * 0.05) * 0.03, CW * 1.25, CH * 1.25, p.rar, 0, 1);
        const R = RAR[p.rar];
        const by = p.y + CH * 1.25 / 2 + 16;
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillRect(centerX - 52, by - 11, 104, 20);
        ctx.fillStyle = R.color;
        ctx.font = 'bold 13px "Courier New",monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+' + R.score + ' 分 · ' + R.name, centerX, by);
      }
    }

    if (goldT > 0) goldT--;

    // ---- 全屏金光（红/橙登场，持续 3 秒）----
    if (goldFxT > 0) {
      const gp = 1 - goldFxT / GOLD_FX_MAX;      // 0→1 进度
      const env = Math.sin(Math.min(1, gp * 1.05) * Math.PI); // 淡入淡出包络
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 全屏金色泛光
      ctx.globalAlpha = 0.16 * env;
      const gg = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.75);
      gg.addColorStop(0, 'rgba(255,240,180,1)');
      gg.addColorStop(1, 'rgba(255,190,80,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(0, 0, W, H);
      // 斜向扫过的一道宽光束
      ctx.globalAlpha = 0.22 * env;
      const bandW = W * 0.22;
      const gx = -bandW + gp * (W + bandW * 2);
      const lg = ctx.createLinearGradient(gx - bandW, 0, gx + bandW, 0);
      lg.addColorStop(0, 'rgba(255,230,150,0)');
      lg.addColorStop(0.5, 'rgba(255,248,210,1)');
      lg.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(gx - bandW, 0, bandW * 2, H);
      ctx.restore();
      // 从屏幕四边缘持续溢出金色粒子
      const spawn = 3 + Math.floor(Math.random() * 3);
      for (let s = 0; s < spawn; s++) {
        const edge = Math.floor(Math.random() * 4);
        let ex, ey, evx, evy;
        const sp = 2 + Math.random() * 4;
        if (edge === 0) { ex = Math.random() * W; ey = -4; evx = (Math.random() - .5) * 2; evy = sp; }
        else if (edge === 1) { ex = W + 4; ey = Math.random() * H; evx = -sp; evy = (Math.random() - .5) * 2; }
        else if (edge === 2) { ex = Math.random() * W; ey = H + 4; evx = (Math.random() - .5) * 2; evy = -sp; }
        else { ex = -4; ey = Math.random() * H; evx = sp; evy = (Math.random() - .5) * 2; }
        particles.push({
          x: ex, y: ey, vx: evx, vy: evy,
          c: Math.random() < 0.5 ? '#ffe9a8' : '#ffcf6a',
          t: 0, life: 40 + Math.random() * 40, gold: true
        });
      }
      goldFxT--;
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i]; q.t++;
      q.x += q.vx; q.y += q.vy; q.vy += q.gold ? 0.05 : 0.25;
      const sz = q.gold ? (Math.random() < 0.5 ? 4 : 3) : 4;
      px(q.x, q.y, sz, sz, q.c);
      if (q.t > q.life) particles.splice(i, 1);
    }
    // 飘分
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.t++;
      f.y -= 1.1;
      ctx.globalAlpha = Math.max(0, 1 - f.t / 46);
      ctx.fillStyle = '#ffe066';
      ctx.font = 'bold 18px "Courier New",monospace';
      ctx.textAlign = 'center';
      ctx.fillText(f.txt, f.x, f.y);
      ctx.globalAlpha = 1;
      if (f.t > 46) floats.splice(i, 1);
    }

    if (state === S.IDLE) {
      ctx.fillStyle = '#3a3a52';
      ctx.font = '12px "Courier New",monospace';
      ctx.textAlign = 'center';
      ctx.fillText('点「抽卡」开始 · 牌堆 ' + DECK_SIZE + ' 张，越抽越少', centerX, centerY);
    }

    // 收起键定位在卡牌右侧
    if (closeBtn.style.display === 'block' && picked) {
      closeBtn.style.left = Math.min(W - 74, picked.x + CW * 0.7) + 'px';
      closeBtn.style.top = (picked.y - 12) + 'px';
    }
    requestAnimationFrame(frame);
  }

  function renderDex() {
    dexEl.innerHTML = RAR.map((r, i) =>
      '<div><span style="display:inline-block;width:8px;height:8px;background:' + r.color +
      ';border:1px solid #000;margin-right:5px"></span>' + r.name + '(' + r.score + '分) ×' + stat[i] + '</div>'
    ).join('');
  }

  resize(); renderDex(); frame();
})();
</script>
